name: Upsert a marker-tagged PR comment
description: >
  Post a report as a pull-request comment, editing the existing one in place when a
  comment already starts with this marker. Used by the reports job, once per report.

inputs:
  marker:
    description: >
      HTML comment the body file starts with, e.g. `<!-- lexicon-report -->`. It is the
      only handle on the comment posted by an earlier run, so a marker that no longer
      matches posts a second comment instead of editing the first.
    required: true
  body-file:
    description: Path to the rendered markdown to post, marker included.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        MARKER: ${{ inputs.marker }}
        BODY_FILE: ${{ inputs.body-file }}
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.BODY_FILE, 'utf8');
          const marker = process.env.MARKER;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((comment) => comment.body.startsWith(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
