# Tier-2 smoke: the journey with a real llm_transform stage, run alongside CI
# on every push/PR as its own named check — so a red here reads "live backend
# problem", distinct from a unit regression in the `test` job.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN, a one-year token from `claude setup-token`
# on a Claude subscription — the SDK reads it (non-bare mode). Do NOT also set
# ANTHROPIC_API_KEY: it outranks the OAuth token in the CLI's auth precedence
# and would silently bill the metered API instead of the subscription.
# Spend is bounded by the test itself anyway (tests/test_journey_live_llm.py:
# 1 row x 3 attempts max, small model, one-line prompt).
#
# CLI version is PINNED (see #208): an unpinned `npm install -g` always grabs
# latest, so a red here could be this gate's code or an untested upstream CLI
# release, indistinguishably. Bump deliberately, after confirming the new
# version passes this tier repeatedly.
#
# 2.1.195 was pinned when intermittent tool-less completions appeared with
# 2.1.217. That inverted on 2026-07-29: master went red here with the model
# answering in prose and emitting ZERO tool_call events across all 3 attempts
# (run 30448998639; the uploaded evidence has the transcript), while 2.1.215
# submitted 6/6 locally on the same task, with both the bare and the fully
# qualified tool name in the system prompt. Reading: an old CLI aged out from
# under the current models rather than a prompt problem. Moving the pin
# forward to the version that was actually exercised.
name: live-llm-smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install -g @anthropic-ai/claude-code@2.1.215
      - run: python -m pytest -m live_llm tests/test_journey_live_llm.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # A red here without the run directory is undiagnosable from the log
      # alone (the failure message carries the manifest's stage records, but
      # transcripts and queue snapshots only exist on disk) — keep the whole
      # pytest tmp tree for the post-mortem.
      - name: Upload run evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-llm-run-evidence
          path: /tmp/pytest-of-*/pytest-*/
          if-no-files-found: warn
          retention-days: 14
