# Tier-2 smoke: the journey with a real llm_transform stage, run alongside CI
# on every push/PR as its own named check — so a red here reads "live backend
# problem", distinct from a unit regression in the `test` job.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN, a one-year token from `claude setup-token`
# on a Claude subscription — the SDK reads it (non-bare mode). Do NOT also set
# ANTHROPIC_API_KEY: it outranks the OAuth token in the CLI's auth precedence
# and would silently bill the metered API instead of the subscription.
# Spend is bounded by the test itself anyway (tests/test_journey_live_llm.py:
# 1 row x 3 attempts max, small model, one-line prompt).
#
# CLI version is PINNED (see #208): an unpinned `npm install -g` always grabs
# latest, so a red here could be this gate's code or an untested upstream CLI
# release, indistinguishably. 2.1.233 is paired with the locked Agent SDK.
name: live-llm-smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --frozen
      - run: npm install -g @anthropic-ai/claude-code@2.1.233
      - run: uv run --frozen python -m pytest -m live_llm tests/test_journey_live_llm.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Kept on every outcome, for two different reasons.
      # A red here without the run directory is undiagnosable from the log alone
      # (the failure message carries the manifest's stage records, but
      # transcripts and queue snapshots only exist on disk).
      # A GREEN run's events.jsonl carries the CLI's opening init inventory —
      # the tool list the model was actually offered under the pinned CLI. That
      # is the only place tool scoping can be observed rather than inferred, and
      # a single green run on its own is weak evidence that it held.
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-llm-run-evidence
          path: /tmp/pytest-of-*/pytest-*/
          if-no-files-found: warn
          retention-days: 14
