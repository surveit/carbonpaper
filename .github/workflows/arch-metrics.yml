name: Architecture gate tally

# Counts how often each architecture gate — the arch tests and the import-linter
# contracts — actually fails in CI, and keeps a running tally on the web as a
# GitHub issue.
#
# WHY A SEPARATE WORKFLOW, not two steps inside the CI jobs: appending to the
# ledger branch and editing the issue need `contents: write` and `issues: write`,
# and the CI jobs execute pull-request code. A write-scoped token in a job that
# runs an unreviewed contributor's code is exactly the token an attacker wants.
# `workflow_run` fires after CI finishes, in the base repository's context, and
# only ever reads CI's uploaded artifacts — it never checks out or runs PR code.
#
# COST: one extra job per CI run. Actions bills a whole minute per job, and this
# one does about fifteen seconds of work, so it costs a billed minute per run.
# Folding it into the existing jobs would be free but would hand them the write
# token described above; that trade was decided in favour of the token.
#
# The tally counts what reached CI, which is a LOWER BOUND on what the gates did:
# a failure caught and fixed before a push leaves no trace here at all.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  # One writer at a time: every run of this workflow pushes to the same ledger
  # branch, and two concurrent pushes would race. Never cancel a run in progress
  # — a cancelled run is a record silently dropped from the denominator.
  group: arch-metrics
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read

env:
  LEDGER_BRANCH: ci-metrics
  LEDGER_FILE: ledger.jsonl
  TALLY_LABEL: arch-tally

jobs:
  tally:
    # A fork's CI run cannot be trusted to supply artifacts that steer a
    # write-scoped job, and its head repository is not this one.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The recorder needs pydantic only; installing the whole project here would
      # cost more than the job it serves.
      - run: pip install --quiet 'pydantic>=2'

      # `continue-on-error` because a CI run that died before the gates ran
      # uploads no artifact. That is a real outcome, not a reason to lose the
      # record: the recorder treats a missing artifact as "this gate did not
      # report" rather than "this gate passed".
      - name: Download contract verdicts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gate-contracts
          path: gates
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download test outcomes
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gate-tests
          path: gates
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Build this run's record
        run: |
          python scripts/arch_failure_ledger.py record \
            --junit gates/junit.xml \
            --imports gates/lint-imports.txt \
            --run-id '${{ github.event.workflow_run.id }}' \
            --run-url '${{ github.event.workflow_run.html_url }}' \
            --created '${{ github.event.workflow_run.created_at }}' \
            --branch '${{ github.event.workflow_run.head_branch }}' \
            --event '${{ github.event.workflow_run.event }}' \
            > record.json
          cat record.json

      # The ledger lives on an orphan branch, cloned into its own directory so
      # this checkout keeps `scripts/` available for the render step below. It is
      # data the repository accumulates, not source, and must never appear in a
      # diff under review.
      - name: Append to the ledger branch
        id: append
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$LEDGER_BRANCH" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            ledger 2>/dev/null || {
              git clone --quiet --depth 1 \
                "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
                ledger
              git -C ledger checkout --quiet --orphan "$LEDGER_BRANCH"
              git -C ledger rm -rqf . 2>/dev/null || true
              : > "ledger/$LEDGER_FILE"
            }
          cd ledger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A rerun of this workflow for an already-recorded run must not inflate
          # the tally, so recording is idempotent on run id.
          run_id='${{ github.event.workflow_run.id }}'
          if [ -f "$LEDGER_FILE" ] && grep -q "\"run_id\":\"$run_id\"" "$LEDGER_FILE"; then
            echo "run $run_id already recorded"
          else
            cat ../record.json >> "$LEDGER_FILE"
            git add "$LEDGER_FILE"
            git commit --quiet -m "record gate outcomes for run $run_id"
            git push --quiet origin "HEAD:$LEDGER_BRANCH"
          fi

      - name: Render the tally
        run: python scripts/arch_failure_ledger.py render "ledger/$LEDGER_FILE" > body.md

      - name: Upsert the tally issue
        uses: actions/github-script@v7
        env:
          TALLY_LABEL: ${{ env.TALLY_LABEL }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('body.md', 'utf8');
            const label = process.env.TALLY_LABEL;
            const { owner, repo } = context.repo;
            const title = 'Architecture gate tally';

            // Found by label, not by title search: the search index is
            // eventually consistent and would create a duplicate issue on a
            // fast second run.
            await github.rest.issues.createLabel({
              owner, repo, name: label, color: '0e8a16',
              description: 'The running architecture gate tally',
            }).catch(() => {});

            const open = await github.rest.issues.listForRepo({
              owner, repo, labels: label, state: 'open', per_page: 5,
            });

            if (open.data.length) {
              const number = open.data[0].number;
              await github.rest.issues.update({ owner, repo, issue_number: number, body });
              core.notice(`Updated tally issue #${number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body, labels: [label],
              });
              core.notice(`Created tally issue #${created.data.number}`);
            }
