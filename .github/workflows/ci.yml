name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # ruff, import-linter and mypy share one job because each takes seconds and
  # Actions bills every job a whole minute: as separate jobs they cost three
  # billed minutes for well under one minute of work, and each pays its own
  # checkout and `uv sync` again. `if: always()` on the later steps keeps the
  # split diagnosis a separate job used to give — a ruff failure still reports
  # whether mypy also failed, rather than masking it.
  #
  # The job keeps the name `lint` because branch protection requires status
  # checks by name; renaming it would leave master waiting on a context that no
  # longer reports.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv project mode: `uv sync --frozen` installs the exact pins in uv.lock
      # into .venv and fails rather than re-resolving if the lock has drifted
      # from pyproject.toml. setup-uv owns the dependency cache (enable-cache),
      # so setup-python no longer passes `cache: pip` — it stays only to supply
      # the 3.12 interpreter uv builds the environment on.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The dev group pulls in the runtime dependencies too, so mypy sees real
      # signatures (fastapi, claude-agent-sdk, ...).
      - run: uv sync --frozen
      - id: ruff
        run: uv run --frozen ruff check .
      # Architecture boundaries: contracts live in pyproject [tool.importlinter].
      # PYTHONPATH=. lets grimp import the `app` package (run from source, not installed).
      - id: imports
        if: always() && steps.ruff.conclusion != 'skipped'
        run: PYTHONPATH=. uv run --frozen lint-imports
      - id: types
        if: always() && steps.ruff.conclusion != 'skipped'
        run: uv run --frozen mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # Guard for refs without tests/: warn loudly instead of green-lighting a
      # bare `pytest`, which would collect the root-level manual probe scripts
      # (test_roldugin.py etc.) that hit real APIs. tests/ and app/ are named
      # explicitly (not bare `pytest`) so the root probes stay uncollected while
      # the colocated app/**/_arch_tests/ architecture checks DO run in CI.
      - run: |
          if [ -d tests ]; then
            uv run --frozen python -m pytest tests/ app/
          else
            echo "::warning::No tests/ directory on this ref — pytest was NOT run."
          fi

  # Informational-only import-graph coupling report, upserted as one PR
  # comment (marker-tagged, edited in place on later pushes rather than
  # posting a new comment each time). Never a required check: a failure
  # here must not be able to block a merge, so it is not added to any
  # branch-protection required-status-checks list.
  import-graph-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Checkout PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # scripts/import_graph_report.py --root points grimp at a different
      # checkout's `app` package for its analysis, reusing this (head)
      # checkout's own copy of the script and of tests/arch/ — the base
      # checkout only needs its `app/` source, never its own copy of either.
      - run: uv run --frozen python scripts/import_graph_report.py > head-metrics.json
      - run: uv run --frozen python scripts/import_graph_report.py --root base > base-metrics.json
      - run: uv run --frozen python scripts/import_graph_report.py --markdown head-metrics.json base-metrics.json > comment-body.md
      # Raw data lives alongside the cooked report: the comment shows the
      # rendered table, but the JSON these two invocations produced is kept
      # too so it can be re-sliced without recomputing. Short retention —
      # this is a debugging aid for the PR under review, not a permanent record.
      - name: Upload raw metrics JSON
        uses: actions/upload-artifact@v4
        with:
          name: import-graph-metrics
          path: |
            head-metrics.json
            base-metrics.json
          retention-days: 14
      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment-body.md', 'utf8');
            const marker = '<!-- import-graph-report -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
