name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      # Architecture boundaries: contracts live in pyproject [tool.importlinter].
      # PYTHONPATH=. lets grimp import the `app` package (run from source, not installed).
      - run: PYTHONPATH=. lint-imports

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # requirements-dev pulls in requirements.txt, so mypy sees real signatures
      # (fastapi, claude-agent-sdk, ...).
      - run: python -m pip install -r requirements-dev.txt
      - run: mypy

  test:
    runs-on: ubuntu-latest
    env:
      # Belt and braces: tests/conftest.py already forces the mock LLM backend,
      # but make sure CI can never shell out to a real model or the network.
      CW_LLM_FORCE_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      # Guard for refs without tests/: warn loudly instead of green-lighting a
      # bare `pytest`, which would collect the root-level manual probe scripts
      # (test_roldugin.py etc.) that hit real APIs.
      - run: |
          if [ -d tests ]; then
            python -m pytest tests/
          else
            echo "::warning::No tests/ directory on this ref — pytest was NOT run."
          fi
