name: CI

on:
  push:
    branches: [master]
  pull_request:

# THE GATE TALLY RUNS INSIDE THESE JOBS, and that is a deliberate trade.
# Recording which architecture gates failed means appending to the `ci-metrics`
# branch and rewriting the tally issue, which needs `contents: write` and
# `issues: write` — held here by jobs that also execute pull-request code. The
# alternative, a `workflow_run` workflow in the base repository's context, keeps
# the write token away from contributor code but costs a whole billed minute per
# run for about fifteen seconds of work. This repository is private with trusted
# contributors, so the minute was judged the greater cost.
#
# What that buys an attacker with a merge-able pull request: a token that can
# push to any branch and edit issues. The fork guard on the recording steps
# keeps it away from unmerged outside contributors, and nothing else.

jobs:
  # ruff, import-linter and mypy share one job because each takes seconds and
  # Actions bills every job a whole minute: as separate jobs they cost three
  # billed minutes for well under one minute of work, and each pays its own
  # checkout and `uv sync` again. `if: always()` on the later steps keeps the
  # split diagnosis a separate job used to give — a ruff failure still reports
  # whether mypy also failed, rather than masking it.
  #
  # The job keeps the name `lint` because branch protection requires status
  # checks by name; renaming it would leave master waiting on a context that no
  # longer reports.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      # uv project mode: `uv sync --frozen` installs the exact pins in uv.lock
      # into .venv and fails rather than re-resolving if the lock has drifted
      # from pyproject.toml. setup-uv owns the dependency cache (enable-cache),
      # so setup-python no longer passes `cache: pip` — it stays only to supply
      # the 3.12 interpreter uv builds the environment on.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The dev group pulls in the runtime dependencies too, so mypy sees real
      # signatures (fastapi, claude-agent-sdk, ...).
      - run: uv sync --frozen
      - id: ruff
        run: uv run --frozen ruff check .
      # Architecture boundaries: contracts live in pyproject [tool.importlinter].
      # PYTHONPATH=. lets grimp import the `app` package (run from source, not installed).
      # `tee` keeps the human-readable output in the log while saving the
      # contract-by-contract verdicts for the recording step below to tally.
      # pipefail so the step still fails on a broken contract despite the pipe.
      - id: imports
        if: always() && steps.ruff.conclusion != 'skipped'
        run: |
          set -o pipefail
          PYTHONPATH=. uv run --frozen lint-imports | tee lint-imports.txt
      - id: types
        if: always() && steps.ruff.conclusion != 'skipped'
        run: uv run --frozen mypy
      # Tally which contracts broke. Same-repository refs only: a fork's
      # GITHUB_TOKEN is read-only, so the append would fail the job over a
      # metric, and a fork's code must not reach a write-scoped token at all.
      - name: Record contract outcomes
        if: >
          always() && steps.imports.conclusion != 'skipped'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: ./.github/actions/record-gates
        with:
          imports: lint-imports.txt
          may-create-issue: "true"
          token: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # Guard for refs without tests/: warn loudly instead of green-lighting a
      # bare `pytest`, which would collect the root-level manual probe scripts
      # (test_roldugin.py etc.) that hit real APIs. tests/ and app/ are named
      # explicitly (not bare `pytest`) so the root probes stay uncollected while
      # the colocated app/**/_arch_tests/ architecture checks DO run in CI.
      # --junitxml records which tests failed in a form the recording step below
      # can read; the log itself is not a stable machine-readable record.
      - run: |
          if [ -d tests ]; then
            uv run --frozen python -m pytest tests/ app/ --junitxml=junit.xml
          else
            echo "::warning::No tests/ directory on this ref — pytest was NOT run."
          fi
      - name: Record test outcomes
        if: >
          always() && hashFiles('junit.xml') != ''
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: ./.github/actions/record-gates
        with:
          junit: junit.xml
          token: ${{ github.token }}

  # Informational-only import-graph coupling report, upserted as one PR
  # comment (marker-tagged, edited in place on later pushes rather than
  # posting a new comment each time). Never a required check: a failure
  # here must not be able to block a merge, so it is not added to any
  # branch-protection required-status-checks list.
  import-graph-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Checkout PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # scripts/import_graph_report.py --root points grimp at a different
      # checkout's `app` package for its analysis, reusing this (head)
      # checkout's own copy of the script and of tests/arch/ — the base
      # checkout only needs its `app/` source, never its own copy of either.
      - run: uv run --frozen python scripts/import_graph_report.py > head-metrics.json
      - run: uv run --frozen python scripts/import_graph_report.py --root base > base-metrics.json
      - run: uv run --frozen python scripts/import_graph_report.py --markdown head-metrics.json base-metrics.json > comment-body.md
      # Raw data lives alongside the cooked report: the comment shows the
      # rendered table, but the JSON these two invocations produced is kept
      # too so it can be re-sliced without recomputing. Short retention —
      # this is a debugging aid for the PR under review, not a permanent record.
      - name: Upload raw metrics JSON
        uses: actions/upload-artifact@v4
        with:
          name: import-graph-metrics
          path: |
            head-metrics.json
            base-metrics.json
          retention-days: 14
      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment-body.md', 'utf8');
            const marker = '<!-- import-graph-report -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  lexicon-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Checkout PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # Same --root trick as import-graph-report: the base checkout supplies only its
      # `app/` source, and this (head) checkout's script reads both. Report-only for
      # now — the job never blocks, so two weeks of real firings can price the noise
      # before anyone decides whether it should.
      - run: uv run --frozen python -m scripts.lexicon > head-lexicon.json
      - run: uv run --frozen python -m scripts.lexicon --root base > base-lexicon.json
      - run: uv run --frozen python -m scripts.lexicon --markdown head-lexicon.json base-lexicon.json > lexicon-body.md
      - name: Upload raw lexicon JSON
        uses: actions/upload-artifact@v4
        with:
          name: lexicon-snapshots
          path: |
            head-lexicon.json
            base-lexicon.json
          retention-days: 14
      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('lexicon-body.md', 'utf8');
            const marker = '<!-- lexicon-report -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
  vocabulary-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Checkout PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # Wider and noisier than vocabulary-report's sibling by design: comment prose is
      # ~2,900 of the ~3,400 words here, and a new word in a sentence is usually just
      # a sentence. Kept separate precisely so the two firing rates can be compared
      # before either is trusted enough to block.
      - run: uv run --frozen python -m scripts.vocabulary > head-vocabulary.json
      - run: uv run --frozen python -m scripts.vocabulary --root base > base-vocabulary.json
      - run: uv run --frozen python -m scripts.vocabulary --markdown head-vocabulary.json base-vocabulary.json > vocabulary-body.md
      - name: Upload raw vocabulary JSON
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-snapshots
          path: |
            head-vocabulary.json
            base-vocabulary.json
          retention-days: 14
      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('vocabulary-body.md', 'utf8');
            const marker = '<!-- vocabulary-report -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
