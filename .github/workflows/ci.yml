name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      # Architecture boundaries: contracts live in pyproject [tool.importlinter].
      # PYTHONPATH=. lets grimp import the `app` package (run from source, not installed).
      - run: PYTHONPATH=. lint-imports

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # requirements-dev pulls in requirements.txt, so mypy sees real signatures
      # (fastapi, claude-agent-sdk, ...).
      - run: python -m pip install -r requirements-dev.txt
      - run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      # Guard for refs without tests/: warn loudly instead of green-lighting a
      # bare `pytest`, which would collect the root-level manual probe scripts
      # (test_roldugin.py etc.) that hit real APIs. tests/ and app/ are named
      # explicitly (not bare `pytest`) so the root probes stay uncollected while
      # the colocated app/**/_arch_tests/ architecture checks DO run in CI.
      - run: |
          if [ -d tests ]; then
            python -m pytest tests/ app/
          else
            echo "::warning::No tests/ directory on this ref — pytest was NOT run."
          fi

  # Informational-only import-graph coupling report, upserted as one PR
  # comment (marker-tagged, edited in place on later pushes rather than
  # posting a new comment each time). Never a required check: a failure
  # here must not be able to block a merge, so it is not added to any
  # branch-protection required-status-checks list.
  import-graph-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Checkout PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      # scripts/import_graph_report.py --root points grimp at a different
      # checkout's `app` package for its analysis, reusing this (head)
      # checkout's own copy of the script and of tests/arch/ — the base
      # checkout only needs its `app/` source, never its own copy of either.
      - run: python scripts/import_graph_report.py > head-metrics.json
      - run: python scripts/import_graph_report.py --root base > base-metrics.json
      - run: python scripts/import_graph_report.py --markdown head-metrics.json base-metrics.json > comment-body.md
      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment-body.md', 'utf8');
            const marker = '<!-- import-graph-report -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
