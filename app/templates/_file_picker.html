{% macro file_picker(name, authored_path, files) %}
<div class="file-picker" data-file-picker>
  <select id="{{ name }}" name="{{ name }}" class="file-picker-native file-pick"
          {% if not authored_path %}required{% endif %}>
    {% if authored_path %}
    <option value="" data-file-kind="authored" data-filename="{{ authored_path }}"
            data-detail="Workflow path">{{ authored_path }}</option>
    {% else %}
    <option value="" data-file-kind="empty" data-filename="Choose a file…"></option>
    {% endif %}
    {% for f in files %}
    <option value="{{ f.sha256 }}" data-uploaded-at="{{ f.uploaded_at.isoformat() }}"
            data-filename="{{ f.filename }}" data-uploaded-label="{{ f.uploaded_label }}"
            data-size-label="{{ f.size_label }}">{{ f.label }}</option>
    {% endfor %}
  </select>
  <button type="button" id="{{ name }}__button" class="file-picker-trigger"
          aria-haspopup="listbox" aria-expanded="false"
          aria-controls="{{ name }}__listbox" hidden>
    <span class="file-picker-value"></span>
    <span class="file-picker-chevron" aria-hidden="true">▾</span>
  </button>
  <button type="button" class="btn file-preview-open" aria-haspopup="dialog"
          aria-controls="run-file-preview" disabled>Preview</button>
  <div class="file-picker-popover" hidden>
    <div class="file-picker-heading">
      <strong>Choose file</strong>
      <span>Uploads newest first</span>
    </div>
    <input type="search" class="file-picker-search" aria-label="Search files"
           placeholder="Search files…" autocomplete="off">
    <div id="{{ name }}__listbox" class="file-picker-list" role="listbox"
         aria-label="Project files"></div>
    <p class="file-picker-empty" hidden>No files match this search.</p>
  </div>
</div>
{% endmacro %}
