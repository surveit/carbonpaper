{#
  RUN CONTROLS — one form that configures AND launches a run:
    · a version_id <select>: every stored version newest-first, `selected_version_id`
      pre-selected — the latest unless the link that reached this page named one
      (the version page's "Run this version" does)
    · one row per file-kind input, built by the `input_row` macro below: a read-only
      path field (binding__<stage_id>) showing the SELECTED version's workflow-authored
      path, its Browse… button, and the row cap beside them
    · an Advanced fold holding the row-level cache checkbox (bust_cache): submitted
      only when checked, so its presence is the value. The run skips every stage-cache
      read and records what it computes, so a human review queue re-asks the humans
      (see prepare_run's `bust_cache` in app/runtime/runner.py). Folded because the
      default — reuse what has already been computed and already been approved — is
      what nearly every run wants, and the alternative spends LLM calls and a
      reviewer's time on rows that have both.
    · ▶ Run workflow

  Version and inputs belong together: different versions can author different input
  stages/paths, so the fields describe whichever version is picked. When the version
  changes, run_controls.js refetches that version's inputs
  (GET /project/<name>/run-inputs?version_id=) and rebuilds the rows — by cloning the
  <template> at the foot of this form, which the SAME macro renders. One markup source
  for both, so a row the script builds cannot drift from a row the server rendered.

  Context (inherited from the including template):
    state       = shell_state(pdir)         — state.id for the form action
    versions    = the project's stored versions, newest-first (may be empty)
    selected_version_id = which of them the picker opens on (None with no versions)
    choices = run_inputs.build_run_input_choices(state.id, selected_version_id) —
              .inputs (one row per file input) and .files (what every row may pick from)
    max_upload_bytes = uploads.max_upload_bytes() — the ceiling Upload… checks a pick
                       against before sending it; the server refuses the same size
#}

{#
  One file input. `stage_id` is the identity the form submits under, so it names
  three attributes at once (binding__, limit__, and the label's `for`); the template
  clone passes an empty one and run_controls.js sets all three.

  The field is a PICKER over the files this project already holds, and its value is a
  file's sha256 — not a path. Blank means "run whatever the workflow authored", which is
  why a row with an authored path is not required. Upload… is for a file the project does
  not hold yet: run_controls.js POSTs it to /project/<name>/files and selects it here.

  The row cap (limit__<stage_id>) is blank for the whole file, or a number N that caps
  this input stage at the first N rows it READS for this run only (prepare_run's
  `limits` in app/runtime/runner.py — this is just its web-form surface). It carries its
  own <label>: inside the row's label it made "first"/"rows" focus the path field. Only
  the number is bordered — "first" and "rows" sit outside the field, because a word
  inside a field's frame reads as something the reader may type over.
#}
{% macro input_row(stage_id, authored_path, files) %}
<div class="run-input-row">
  <label class="run-input-name" for="binding__{{ stage_id }}">
    <code>{{ stage_id }}</code> — data file
  </label>
  <div class="run-input-controls">
    <span class="path-field">
      <select id="binding__{{ stage_id }}" name="binding__{{ stage_id }}"
              class="file-pick" {% if not authored_path %}required{% endif %}>
        {% if authored_path %}
        <option value="">{{ authored_path }} — the path this workflow names</option>
        {% else %}
        <option value="">Choose a file…</option>
        {% endif %}
        {% for f in files %}
        <option value="{{ f.sha256 }}">{{ f.filename }} — {{ f.bytes | filesize }}</option>
        {% endfor %}
      </select>
      <input type="file" class="file-input" hidden>
      <button type="button" class="btn browse-btn">Upload…</button>
    </span>
    <label class="run-limit" title="read only the first N rows of this file, for this run">
      <span>first</span>
      <input type="number" name="limit__{{ stage_id }}" min="0" step="1"
             inputmode="numeric" placeholder="all">
      <span>rows</span>
    </label>
  </div>
</div>
{% endmacro %}

{% if versions %}
<form action="/project/{{ state.id }}/run" method="post" class="run-controls"
      data-project="{{ state.id }}" data-max-upload-bytes="{{ max_upload_bytes }}">
  <label class="run-version">version
    <select name="version_id">
      {% for v in versions %}
      <option value="{{ v.version_id }}"{% if v.version_id == selected_version_id %} selected{% endif %}>{{ v.version_id }}{% if v.message %} — {{ v.message }}{% endif %}{% if loop.first %} (latest){% endif %}</option>
      {% endfor %}
    </select>
  </label>
  <div class="run-inputs">
    {% for row in choices.inputs %}{{ input_row(row.stage_id, row.authored_path, choices.files) }}{% endfor %}
  </div>
  {# The one place a file leaves the reader's machine, so the one place the strip's
     standing fact is worth repeating in the specific. #}
  {% if serves_an_open_demo() %}
  <p class="demo-upload-note">Open demo — this file becomes readable by every visitor and
    by any stage anyone writes. Upload only what can be made public.</p>
  {% endif %}
  <details class="run-advanced">
    <summary>Advanced</summary>
    <label class="run-bust-cache">
      <input type="checkbox" name="bust_cache" value="on">
      <span>Do not use row-level cache (e.g. recompute rows that LLM has already
        processed, or require human review on the same data they already approved)</span>
    </label>
  </details>
  <button type="submit" class="btn primary">▶ Run workflow</button>
  {# Inert until run_controls.js clones it; a <template>'s fields are not part of
     the form, so the empty stage_id below is never submitted. #}
  <template class="run-input-template">{{ input_row("", "", []) }}</template>
</form>
<script src="/static/run_controls.js"></script>
{% else %}
<div class="empty-state">
  <h2>No version to run</h2>
  <p>A run pins to a version and reads its snapshot, so there is nothing for it to
    execute until the workflow has been snapshotted once.</p>
  <a href="/project/{{ state.id }}/workflow" class="btn primary">Create version</a>
</div>
{% endif %}
