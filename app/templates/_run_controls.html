{#
  RUN CONTROLS — one form that configures AND launches a run:
    · a version_id <select>: every published version newest-first, the latest pre-selected
      (so a run defaults to latest, any version is one click away)
    · one read-only path field per file-kind input (binding__<stage_id>), showing
      the SELECTED version's workflow-authored path — each with a Browse… button
      that (via run_controls.js) opens the browser's native file dialog and uploads
      the chosen file to POST /project/<name>/upload-input, which saves it and puts
      the saved copy's absolute path in the field. The field is display-only; Browse
      is the only way to change it (a workflow-authored path is still read in place).
    · alongside each path field, an optional row-cap field (limit__<stage_id>):
      blank runs the full file, a number N caps that input stage at the first N
      rows it READS for this run only (see prepare_run's `limits` in
      app/runtime/runner.py — this form is just its web-form surface)
    · a recompute-everything checkbox (bust_cache): submitted only when checked, so
      its presence is the value. The run skips every stage-cache read and records
      what it computes, so a human review queue re-asks the humans (see prepare_run's
      `bust_cache` in app/runtime/runner.py)
    · ▶ Run workflow

  Version and inputs belong together: different versions can author different input
  stages/paths, so the fields describe whichever version is picked. When the version
  changes, run_controls.js refetches that version's inputs
  (GET /project/<name>/run-inputs?version_id=) and re-renders the path + row-cap fields.

  Context (inherited from the including template):
    state       = shell_state(pdir)         — state.name for the form action
    versions    = the project's PUBLISHED versions, newest-first (may be empty)
    file_inputs = loading.list_file_inputs(pdir)   — [{stage_id, path}]
#}
{% if versions %}
<form action="/project/{{ state.name }}/run" method="post" class="run-controls"
      data-project="{{ state.name }}">
  <label class="run-version">version
    <select name="version_id">
      {% for v in versions %}
      <option value="{{ v.version_id }}"{% if loop.first %} selected{% endif %}>{{ v.version_id }}{% if v.message %} — {{ v.message }}{% endif %}{% if loop.first %} (latest){% endif %}</option>
      {% endfor %}
    </select>
  </label>
  <div class="run-inputs">
    {% for fi in file_inputs %}
    <label class="run-input-row">
      <code>{{ fi.stage_id }}</code> — data file
      <span class="path-field">
        <input type="text" name="binding__{{ fi.stage_id }}" value="{{ fi.path }}"
               placeholder="no file chosen — click Browse…" readonly
               size="70" {% if not fi.path %}required{% endif %}>
        <input type="file" class="file-input" hidden>
        <button type="button" class="btn browse-btn">Browse…</button>
      </span>
      · first <input type="number" name="limit__{{ fi.stage_id }}" min="0"
                      placeholder="all" size="6"> rows
    </label>
    {% endfor %}
  </div>
  <label class="run-bust-cache">
    <input type="checkbox" name="bust_cache" value="on">
    recompute everything (ignore cached results; a review queue re-asks the humans)
  </label>
  <button type="submit" class="btn primary">▶ Run workflow</button>
</form>
<script src="/static/run_controls.js"></script>
{% else %}
<p class="muted">No published version to run yet —
  <a href="/project/{{ state.name }}/workflow/versions">publish a version</a> first.</p>
{% endif %}
