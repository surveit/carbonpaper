[pytest]
testpaths = tests app
pythonpath = . tests
addopts = -q -m "not live_llm and not live_generation"
markers =
    live_llm: end-to-end smoke against the real LLM backend — spends tokens; opt in with -m live_llm
    live_generation: live workflow generation from a fixture methodology — spends tokens, takes minutes; opt in with -m live_generation
