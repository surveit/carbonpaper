# Fly.io deployment. The GitHub integration builds this repo's Dockerfile on push;
# there is no deploy workflow and no token in the repo.
#
# No credential is in this file. ANTHROPIC_API_KEY is a secret, set out of band
# with `fly secrets set`; Fly injects it into the machine's environment, where the
# Claude Code CLI that claude-agent-sdk spawns picks it up. That environment is
# the single auth seam — a subscription-authenticated deploy swaps in
# CLAUDE_CODE_OAUTH_TOKEN and drops the API key without touching the image. See
# the README for why the two must not both be set.
#
# No [deploy] release_command: a release command runs on a temporary machine with
# no volume attached, so it cannot reach /data/app.db. `alembic upgrade head` runs
# in docker-entrypoint.sh instead, on the machine that owns the volume.

app = "carbonpaper"
primary_region = "iad"

[build]

[env]
  CARBON_PAPER_DB_PATH = "/data/app.db"
  CARBON_PAPER_PROJECTS_DIR = "/data/projects"

# One machine, one volume. The document store is SQLite on this volume and the
# projects/frames trees are plain files beside it, so a second machine would be a
# second, diverging workspace — not a replica.
[[mounts]]
  source = "carbonpaper_data"
  destination = "/data"

# The machine is meant never to idle out, because waking it is too slow to hide.
# Boot is ~20s — 1.3s of `alembic upgrade head`, 2.5s importing app.main, and ~12s
# reading the 649MB venv's native extensions off a cold page cache — and the proxy
# logs "instance refused connection" while that runs, which the caller sees as a
# 502. Staying up costs $11.81/mo at this machine's shared-cpu-2x rate.
#
# NONE OF THESE SETTINGS BIND WHILE THE FLY ORG IS ON A TRIAL. A trial machine is
# stopped after 5m0s of runtime whatever its service config says — flyd emits
# "Trial machine stopping. To run for longer than 5m0s, add a credit card", and it
# fired on all three stops observed on 2026-08-12 with min_machines_running = 1 and
# autostop off already live. That cap, not autostop, is also why the earlier
# auto_stop_machines = "suspend" never once produced a suspended machine: a manual
# `fly machine suspend` on this machine resumes in 0.9s, so it is eligible; the
# trial killer simply stops rather than suspends. A payment method on the org is
# the precondition for any of this working.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
