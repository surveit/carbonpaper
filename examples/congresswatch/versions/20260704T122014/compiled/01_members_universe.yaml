id: members_universe
name: Members of Congress (active in slice)
type: input_data

source:
  doc: examples/congresswatch/methodology_raw.md
  section: "§1"
  lines: [10, 22]

connector:
  kind: file
  params:
    path: examples/congresswatch/data/members.csv
    format: csv
  refresh: per_slice
  notes: |
    Generated by examples/congresswatch/code/build_slice.py — the set of
    bioguide_ids that authored at least one press release in the slice
    window. Not a curated roster; production would join Congress.gov for
    the full member roll plus committee assignments.

output_schema:
  primary_key: [entity_id]
  estimated_rows: 535
  columns:
    - {name: entity_id, type: str, nullable: false,
       description: "M:<bioguide_id>"}
    - {name: bioguide_id, type: str, nullable: false}
    - {name: name, type: str, nullable: false}
    - {name: state, type: str, nullable: false}
    - {name: party, type: str, nullable: false,
       range: [Democrat, Republican, Independent]}
    - {name: chamber, type: str, nullable: false, range: [House, Senate]}

compiler_notes:
  - "Universe is derived from the press corpus rather than curated. A member
     with zero press releases in the slice does not appear here."
