id: publish_member_profiles
name: Publish per-member profile pages
type: publish

source:
  doc: examples/congresswatch/methodology_raw.md
  section: "§9"
  lines: [139, 153]

inputs:
  - id: cell_aggregation
    schema:
      primary_key: [entity_id, query_id]
      columns:
        - {name: entity_id, type: str, nullable: false}
        - {name: query_id, type: str, nullable: false}
        - {name: cell_score, type: float, nullable: true}
        - {name: evidence_count, type: int, nullable: false}
        - {name: most_recent_evidence, type: date, nullable: true}
  - id: members_universe
    schema:
      primary_key: [entity_id]
      columns:
        - {name: entity_id, type: str, nullable: false}
        - {name: name, type: str, nullable: false}
        - {name: state, type: str, nullable: false}
        - {name: party, type: str, nullable: false}
        - {name: chamber, type: str, nullable: false}
  - id: extreme_score_review
    schema:
      primary_key: [evidence_id, benchmark_id]
      columns:
        - {name: evidence_id, type: str, nullable: false}
        - {name: entity_id, type: str, nullable: false}
        - {name: query_id, type: str, nullable: false}
        - {name: final_score, type: int, nullable: true}
        - {name: quote, type: str, nullable: true}
  - id: policy_queries
    schema:
      primary_key: [query_id]
      columns:
        - {name: query_id, type: str, nullable: false}
        - {name: title, type: str, nullable: false}
        - {name: left_pole, type: str, nullable: false}
        - {name: right_pole, type: str, nullable: false}
  - id: lobbying_by_query
    schema:
      primary_key: [query_id]
      columns:
        - {name: query_id, type: str, nullable: false}
        - {name: title, type: str, nullable: false}
        - {name: filing_count, type: int, nullable: false}
        - {name: total_spend_usd, type: float, nullable: true}
        - {name: top_clients_json, type: json, nullable: false}

publish:
  format: html_report
  destination: build/profiles/
  one_file_per: entity_id
  cross_link: true

function:
  kind: module
  module: examples.congresswatch.code.publish_member_profiles
  function: transform
  requirements: [pandas]

output_schema:
  primary_key: [output_path]
  estimated_rows: 500
  columns:
    - {name: entity_id, type: str, nullable: false}
    - {name: output_path, type: str, nullable: false}
    - {name: rendered_at, type: datetime, nullable: false}
    - {name: bytes, type: int, nullable: false}

compiler_notes:
  - "Profile pages explicitly do NOT claim influence. They show member's
     public stance next to issue-level lobbying landscape and let the
     reader pattern-match."
