id: benchmark_scoring
name: Score each (evidence, benchmark) on the stance axis
type: llm_transform

source:
  doc: examples/congresswatch/methodology_raw.md
  section: "§5"
  lines: [80, 99]

inputs:
  - id: evidence_with_benchmarks
    schema:
      primary_key: [evidence_id, benchmark_id]
      columns:
        - {name: evidence_id, type: str, nullable: false}
        - {name: benchmark_id, type: str, nullable: false}
        - {name: entity_id, type: str, nullable: false}
        - {name: query_id, type: str, nullable: false}
        - {name: quote, type: str, nullable: false}
        - {name: stance_summary, type: str, nullable: false}
        - {name: confidence, type: float, nullable: false}
        - {name: benchmark_text, type: str, nullable: false}
        - {name: published_at, type: date, nullable: false}

llm:
  model: claude-sonnet-4-6
  temperature: 0.0
  response_format: json
  max_retries: 3
  prompt_template: |
    You are assigning a stance score on a -2 to +2 axis.

    The benchmark describes the LEFT pole (+2) and RIGHT pole (-2) of the
    spectrum. The score reflects alignment with the LEFT pole. It is NOT a
    judgment of policy correctness.

    Benchmark: {benchmark_text}

    Evidence:
    > {quote}

    Initial AI stance label (for context): {stance_summary}

    Return a JSON object:
      {{"score": -2|-1|0|1|2,
        "reasoning": "one sentence",
        "precedence_failure": false}}

    Set precedence_failure=true ONLY if the evidence quote does not actually
    relate to the benchmark — e.g., the query_id was mis-tagged upstream.

  rubric:
    "+2": "Strongly endorses the LEFT pole (active reform / pro-extension / pro-regulation direction)."
    "+1": "Weakly supports the LEFT pole."
    "0":  "Mixed, hedged, or unclear."
    "-1": "Weakly opposes (leans toward the RIGHT pole)."
    "-2": "Strongly endorses the RIGHT pole."

output_schema:
  primary_key: [evidence_id, benchmark_id]
  estimated_rows: 1500
  columns:
    - {name: evidence_id, type: str, nullable: false}
    - {name: benchmark_id, type: str, nullable: false}
    - {name: entity_id, type: str, nullable: false}
    - {name: query_id, type: str, nullable: false}
    - {name: quote, type: str, nullable: false}
    - {name: score, type: int, nullable: false, range: [-2, 2]}
    - {name: reasoning, type: str, nullable: false}
    - {name: precedence_failure, type: bool, nullable: false}
    - {name: published_at, type: date, nullable: false}

compiler_notes:
  - "Mock LLM scores via regex on stance keywords. Real LLM call needed for
     production. The mock will not capture nuance like 'I support X but
     only if Y' which most domestic policy speech contains."
