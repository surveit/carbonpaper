id: members_universe
name: Members active in both windows
type: input_data

source:
  doc: examples/drift/methodology_raw.md
  section: "§1"
  lines: [13, 17]

connector:
  kind: file
  params:
    path: examples/drift/data/members.csv
    format: csv
  refresh: per_slice

output_schema:
  primary_key: [entity_id]
  estimated_rows: 200
  columns:
    - {name: entity_id, type: str, nullable: false}
    - {name: bioguide_id, type: str, nullable: false}
    - {name: name, type: str, nullable: false}
    - {name: state, type: str, nullable: false}
    - {name: party, type: str, nullable: false}
    - {name: chamber, type: str, nullable: false}
    - {name: early_release_count, type: int, nullable: false}
    - {name: recent_release_count, type: int, nullable: false}
