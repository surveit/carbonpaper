id: publish_drift_stories
name: Publish ranked drift story cards
type: publish

source:
  doc: examples/drift/methodology_raw.md
  section: "§6"
  lines: [69, 79]

inputs:
  - id: drift_brief
    schema:
      primary_key: [entity_id]
      columns:
        - {name: entity_id, type: str, nullable: false}
        - {name: name, type: str, nullable: false}
        - {name: party, type: str, nullable: false}
        - {name: state, type: str, nullable: false}
        - {name: chamber, type: str, nullable: false}
        - {name: notability_score, type: int, nullable: true}
        - {name: headline, type: str, nullable: true}
        - {name: topical_drift, type: json, nullable: true}
        - {name: stance_drift, type: json, nullable: true}
        - {name: new_talking_points, type: json, nullable: true}
        - {name: abandoned_talking_points, type: json, nullable: true}
        - {name: story_hypothesis, type: str, nullable: true}
        - {name: early_url_map, type: json, nullable: true}
        - {name: recent_url_map, type: json, nullable: true}
  - id: notability_rank
    schema:
      primary_key: [rank]
      columns:
        - {name: rank, type: int, nullable: false}
        - {name: entity_id, type: str, nullable: false}

publish:
  format: html_report
  destination: build/drift_stories/
  one_file_per: story
  cross_link: true

function:
  kind: module
  module: examples.drift.code.publish_drift_stories
  function: transform
  requirements: [pandas]

output_schema:
  primary_key: [output_path]
  estimated_rows: 200
  columns:
    - {name: entity_id, type: str, nullable: false}
    - {name: output_path, type: str, nullable: false}
    - {name: rendered_at, type: datetime, nullable: false}
    - {name: bytes, type: int, nullable: false}
