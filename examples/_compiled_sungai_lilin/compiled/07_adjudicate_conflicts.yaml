id: adjudicate_conflicts
name: Resolve conflicting values across sources (LLM adjudication)
type: llm_transform
source:
  doc: transcript_summary
  section: capacity_flagged_discrepancy
inputs:
- id: consolidate_per_facility
  schema:
    primary_key:
    - facility_id
    columns:
    - name: facility_id
      type: str
    - name: fbb_capacity_mt_hr_current
      type: float
    - name: fbb_capacity_mt_hr_all_sources
      type: json
    - name: ghg_kg_co2e_per_t_cpo_current
      type: float
    - name: ghg_kg_co2e_per_t_cpo_all_sources
      type: json
    - name: methane_capture_mw_current
      type: float
    - name: methane_capture_mw_all_sources
      type: json
    - name: biomass_boiler_mw_current
      type: float
    - name: biomass_boiler_mw_all_sources
      type: json
    - name: has_conflicts
      type: bool
    - name: conflict_fields
      type: json
llm:
  model: haiku
  temperature: 0.0
  response_format: json
  prompt_template: 'For facility {facility_id}, resolve these conflicting field values: {conflict_fields_json}.
    For each conflict, determine the most authoritative value by considering: (1) recency (more recent
    likely more current), (2) source authority (RSPO official > cert body > PR > news), (3) document type
    (P&C audit > announcement > regulatory > news), (4) whether value is certified vs estimated. Return
    JSON with resolved values and for each conflict field: {field_name, final_value, primary_source_url,
    primary_source_year, rationale, confidence}.'
output_schema:
  primary_key:
  - facility_id
  columns:
  - name: facility_id
    type: str
  - name: fbb_capacity_mt_hr_final
    type: float
  - name: fbb_capacity_mt_hr_source
    type: str
  - name: fbb_capacity_mt_hr_year
    type: int
  - name: fbb_capacity_mt_hr_confidence
    type: str
  - name: fbb_capacity_mt_hr_rationale
    type: str
  - name: ghg_kg_co2e_per_t_cpo_final
    type: float
  - name: ghg_kg_co2e_per_t_cpo_source
    type: str
  - name: ghg_kg_co2e_per_t_cpo_year
    type: int
  - name: ghg_kg_co2e_per_t_cpo_confidence
    type: str
  - name: cpo_mt_yr_final
    type: float
  - name: cpo_mt_yr_source
    type: str
  - name: cpo_mt_yr_year
    type: int
  - name: pk_mt_yr_final
    type: float
  - name: pk_mt_yr_source
    type: str
  - name: pk_mt_yr_year
    type: int
  - name: pome_treatment_final
    type: str
  - name: pome_treatment_source
    type: str
  - name: methane_capture_mw_final
    type: float
  - name: methane_capture_mw_source
    type: str
  - name: biomass_boiler_mw_final
    type: float
  - name: biomass_boiler_mw_source
    type: str
  - name: adjudication_confidence
    type: str
  - name: human_review_required
    type: bool
compiler_notes:
- 'JUDGMENT POINT: The LLM applies domain logic to resolve conflicts. In the run, capacity 100 MT/hr (2023,
  most recent, mill-specific) won over 120 MT/hr (FY2015-16, permit ceiling); 947.86 kg CO2e/t was from
  FY2015-16 and best available; methane capture (~0.6 MW, Winrock pilot) and biomass boilers (main energy)
  were confirmed as separate systems.'
- This stage flags human_review_required=true if conflicts remain unresolvable.
- Temperature 0 because adjudication should be reproducible.
