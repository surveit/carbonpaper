id: render_dossier
name: Render final research dossier (HTML report)
type: publish
source:
  doc: transcript_summary
  section: final_report
inputs:
- id: enrich_context
  schema:
    primary_key:
    - facility_id
    columns:
    - name: facility_id
      type: str
    - name: facility_name
      type: str
    - name: parent_company
      type: str
    - name: country
      type: str
    - name: region
      type: str
    - name: coordinates
      type: json
    - name: cpo_mt_yr_final
      type: float
    - name: ghg_kg_co2e_per_t_cpo_final
      type: float
    - name: pome_treatment_final
      type: str
    - name: methane_capture_mw_final
      type: float
    - name: biomass_boiler_mw_final
      type: float
publish:
  format: html
  destination: output/dossier_{facility_id}.html
  cross_link: true
function:
  kind: inline
  code: 'Render facility dossier as HTML: (1) Identity section (name, location, coordinates, parent, RSPO
    ID), (2) Capacity & Production (FFB capacity, CPO/PK annual), (3) GHG & Climate (per-tonne figure
    with source year), (4) POME Treatment (system type, pond count, monitoring), (5) Renewable Energy
    (biomass boiler MW, methane capture MW, homes powered), (6) Certification (cert number, body, validity
    dates), (7) Data Sources & Confidence (table of all source URLs, doc types, extraction confidence).
    Use citations (footnote links) for every claim. Include narrative section explaining research path
    and conflicts resolved.'
output_schema:
  primary_key:
  - facility_id
  columns:
  - name: facility_id
    type: str
  - name: report_html
    type: str
  - name: report_format
    type: str
  - name: render_timestamp
    type: datetime
compiler_notes:
- 'Final stage: renders all adjudicated data + sources into human-readable report.'
- The report should match the structure and content of the transcript's 'final report' section.
- Includes narrative of research path (identity-first search, authority ranking, conflict resolution)
  to be transparent about methodology.
