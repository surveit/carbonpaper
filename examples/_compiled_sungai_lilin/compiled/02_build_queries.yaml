id: build_queries
name: Build search query variants
type: python_transform
source:
  doc: transcript_summary
  section: move_1_identity_first_search
inputs:
- id: seed_entity
  schema:
    primary_key:
    - facility_id
    columns:
    - name: facility_id
      type: str
    - name: facility_name
      type: str
    - name: region
      type: str
    - name: country
      type: str
function:
  kind: inline
  code: 'Generate search query variants: (1) RSPO + mill name + CARGILL, (2) mill name + RSPO public summary
    audit, (3) RSPO certificate + PalmTrace ID, (4) PROPER rating + region, (5) recent cert body + mill
    name, (6) biomass+methane queries to disambiguate energy systems, (7) subsidiary sources (Winrock,
    USAID, news). Return {facility_id, query_id, search_query, query_intent}.'
output_schema:
  primary_key:
  - facility_id
  - query_id
  columns:
  - name: facility_id
    type: str
  - name: query_id
    type: str
  - name: search_query
    type: str
  - name: query_intent
    type: str
compiler_notes:
- This stage deterministically generates search queries. In the run, ~13 WebSearch queries covered identity,
  certification, capacity, POME, GHG, biomass/methane, PROPER, and regulatory sources.
- 'This should be pure Python: template expansion + keyword variations, no LLM.'
