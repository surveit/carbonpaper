id: consolidate_per_facility
name: Consolidate multi-document extracts to facility-level
type: python_transform
source:
  doc: transcript_summary
  section: move_3_recency_authority_ranking
inputs:
- id: extract_fields
  schema:
    primary_key:
    - facility_id
    - source_url
    columns:
    - name: facility_id
      type: str
    - name: source_url
      type: str
    - name: cert_number
      type: str
    - name: cert_body
      type: str
    - name: fbb_capacity_mt_hr
      type: float
    - name: cpo_mt_yr
      type: float
    - name: pk_mt_yr
      type: float
    - name: ghg_kg_co2e_per_t_cpo
      type: float
    - name: pome_treatment_system
      type: str
    - name: methane_capture_mw
      type: float
    - name: biomass_boiler_mw
      type: float
    - name: cert_validity_end
      type: date
    - name: production_year
      type: int
    - name: extraction_confidence
      type: str
function:
  kind: inline
  code: 'Group by facility_id. For each facility: (1) Identify most-recent cert by cert_validity_end/audit_end_date.
    (2) For each data field, collect all non-null values with source URLs, years, and confidence. (3)
    Create output row with facility_id, most_recent_cert_number, most_recent_cert_body, most_recent_cert_date,
    and for each field store {current_value (from most recent), all_values_json (list of {value, source_url,
    year, confidence})}. This enables conflict detection downstream.'
output_schema:
  primary_key:
  - facility_id
  columns:
  - name: facility_id
    type: str
  - name: most_recent_cert_number
    type: str
  - name: most_recent_cert_body
    type: str
  - name: most_recent_cert_date
    type: date
  - name: fbb_capacity_mt_hr_current
    type: float
  - name: fbb_capacity_mt_hr_all_sources
    type: json
  - name: cpo_mt_yr_current
    type: float
  - name: cpo_mt_yr_all_sources
    type: json
  - name: pk_mt_yr_current
    type: float
  - name: pk_mt_yr_all_sources
    type: json
  - name: ghg_kg_co2e_per_t_cpo_current
    type: float
  - name: ghg_kg_co2e_per_t_cpo_all_sources
    type: json
  - name: pome_treatment_system
    type: str
  - name: methane_capture_mw_current
    type: float
  - name: methane_capture_mw_all_sources
    type: json
  - name: biomass_boiler_mw_current
    type: float
  - name: biomass_boiler_mw_all_sources
    type: json
  - name: has_conflicts
    type: bool
  - name: conflict_fields
    type: json
compiler_notes:
- DETERMINISTIC aggregation. Groups rows per facility, picks most recent cert, tracks all values per field.
- The _all_sources columns enable downstream conflict detection and adjudication.
- has_conflicts and conflict_fields flag which fields have multiple differing values (e.g., capacity 100
  vs 120).
