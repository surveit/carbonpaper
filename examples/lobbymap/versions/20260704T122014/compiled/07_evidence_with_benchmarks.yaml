id: evidence_with_benchmarks
name: Join evidence to applicable benchmarks
type: join

source:
  doc: examples/lobbymap/stages/04_benchmark_scoring.md
  section: "§4.3, §4.4"
  lines: [311, 330]

inputs:
  - id: evidence_extraction
    schema:
      primary_key: [evidence_id]
      columns:
        - {name: evidence_id, type: str, nullable: false}
        - {name: entity_id, type: str, nullable: false}
        - {name: query_id, type: str, nullable: false}
        - {name: quote, type: str, nullable: false}
        - {name: confidence, type: float, nullable: false}
  - id: benchmark_library
    schema:
      primary_key: [benchmark_id]
      columns:
        - {name: benchmark_id, type: str, nullable: false}
        - {name: query_id, type: str, nullable: false}
        - {name: kind, type: str, nullable: false}
        - {name: jurisdiction, type: str, nullable: true}
        - {name: benchmark_text, type: str, nullable: false}
        - {name: precedence_rule, type: str, nullable: false}

join:
  type: inner
  keys:
    - {left: query_id, right: query_id}
  select:
    - evidence_id
    - entity_id
    - query_id
    - quote
    - confidence
    - benchmark_id
    - benchmark_text
    - kind
    - jurisdiction
    - precedence_rule

output_schema:
  primary_key: [evidence_id, benchmark_id]
  estimated_rows: 60000
  columns:
    - {name: evidence_id, type: str, nullable: false}
    - {name: entity_id, type: str, nullable: false}
    - {name: query_id, type: str, nullable: false}
    - {name: quote, type: str, nullable: false}
    - {name: confidence, type: float, nullable: false, range: [0.0, 1.0]}
    - {name: benchmark_id, type: str, nullable: false}
    - {name: benchmark_text, type: str, nullable: false}
    - {name: kind, type: str, nullable: false, range: [science_based, government_policy]}
    - {name: jurisdiction, type: str, nullable: true}
    - {name: precedence_rule, type: str, nullable: false}

compiler_notes:
  - "Inner join may produce multiple rows per evidence_id when both science-
     based and government-policy benchmarks apply to the same query. The
     benchmark_scoring stage downstream is responsible for applying the
     §4.4 precedence rule (use government_policy only when all four conditions
     hold). That logic deliberately lives in the LLM stage's prompt, not in
     this join, because applying it requires reading the evidence text — not
     a structural operation."
