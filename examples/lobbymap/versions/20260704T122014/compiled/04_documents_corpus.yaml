id: documents_corpus
name: Documents corpus (8 source classes per §4.5)
type: input_data

source:
  doc: examples/lobbymap/stages/02_source_ingestion.md
  section: "§4.5, Table 3"
  lines: [241, 252]

connector:
  kind: file
  params:
    path: examples/lobbymap/data/documents_corpus_sample.csv
    format: csv
    parse_dates: [published_at]
  refresh: weekly

output_schema:
  primary_key: [doc_id]
  estimated_rows: 150000
  columns:
    - {name: doc_id, type: str, nullable: false}
    - {name: entity_id, type: str, nullable: false,
       description: "References tracked_entities.entity_id."}
    - {name: source_class, type: str, nullable: false,
       range: [org_website, corporate_media, cdp_response,
               regulatory_consultation, reliable_media,
               management_messaging, financial_disclosure,
               lobbying_register, paid_climate_advertising]}
    - {name: title, type: str, nullable: true}
    - {name: body, type: str, nullable: false,
       description: "Cleaned text content. Length-uncapped; typical 500-50000 chars."}
    - {name: published_at, type: datetime, nullable: false}
    - {name: url, type: str, nullable: true}

compiler_notes:
  - "Production system would expand this into 8 separate input_data stages,
     one per source class with its own connector (scrape for org websites, http
     for CDP API, manual_upload for FOIA-obtained consultation docs, etc.)
     plus a join/union. Collapsed to one stage in the MVP — flagged for
     expansion."
  - "The 8th source class is ambiguous in the methodology — see prose line 250.
     Encoded both possible values (lobbying_register, paid_climate_advertising)
     in the enum so either reading is valid."
