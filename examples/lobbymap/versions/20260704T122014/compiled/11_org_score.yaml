id: org_score
name: Organisation Score and Engagement Intensity
type: python_frame_function

source:
  doc: examples/lobbymap/stages/07_org_score_intensity.md
  section: "§4.7, §4.8, §2.3"
  lines: [218, 365]

inputs:
  - id: cell_aggregation
    schema:
      primary_key: [entity_id, source_class, query_id]
      columns:
        - {name: entity_id, type: str, nullable: false}
        - {name: source_class, type: str, nullable: false}
        - {name: query_id, type: str, nullable: false}
        - {name: cell_score, type: float, nullable: true}
        - {name: cell_intensity, type: float, nullable: false}
  - id: cell_weights        # static config; treated as a virtual input_data stage
    schema:
      primary_key: [sector, source_class, query_id]
      columns:
        - {name: sector, type: str, nullable: false}
        - {name: source_class, type: str, nullable: false}
        - {name: query_id, type: str, nullable: false}
        - {name: weight, type: float, nullable: false, range: [0.0, 10.0]}
  - id: tracked_entities
    schema:
      primary_key: [entity_id]
      columns:
        - {name: entity_id, type: str, nullable: false}
        - {name: sectors, type: "list[str]", nullable: false}

function:
  kind: module
  module: examples.lobbymap.code.compute_org_score
  function: transform
  requirements: [pandas]

output_schema:
  primary_key: [entity_id]
  estimated_rows: 930
  columns:
    - {name: entity_id, type: str, nullable: false}
    - {name: org_score, type: float, nullable: true, range: [0.0, 100.0]}
    - {name: org_score_band, type: str, nullable: true,
       range: [A+, A, A-, B, C, D, E, F]}
    - {name: engagement_intensity, type: float, nullable: false, range: [0.0, "+inf"]}
    - {name: intensity_label, type: str, nullable: false,
       range: [high, medium, low, minimal]}

review:
  when: "intensity_label == 'high' AND (org_score_band == 'A+' OR org_score_band == 'F')"
  routing: 1-of-1
  rationale: |
    Headline grades on highly-active entities are the most-cited public
    output. Light human pass on the extremes is cheap insurance against
    methodology drift.

compiler_notes:
  - "Methodology specifies the score is 0–100 but does not give the closed-form
     normalization. Encoded a linear remap (-2→0, +2→100) so the function is
     executable; this is a compiler default and should be calibrated against
     InfluenceMap's published scores."
  - "Sector weighting (§4.7) is data-driven: cell_weights is a static config
     table loaded as an input. Real cell_weights data must be authored
     separately by methodology owners."
  - "Band layout: only A+ (95–100) and E- (25–30) are anchored in prose. The
     8-band layout chosen here (A+/A/A-/B/C/D/E/F at 5-point step intervals)
     is the compiler's reconstruction. Different from the 16-band 'PerformanceBand'
     described elsewhere in the methodology — that lives further downstream
     (combined with relationship score)."
  - "Intensity floor (5) drawn from §2.3. Below the floor, org_score is NULL
     ('n/a' in published profiles)."
  - "N/S (no-stance) and N/A (not-applicable) cells are upstream concerns; this
     stage assumes cell_score=NULL means drop, not zero, which renormalizes
     weights within entity."
