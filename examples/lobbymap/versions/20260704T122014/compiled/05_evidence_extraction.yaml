id: evidence_extraction
name: Extract evidence pieces and tag to policy queries
type: llm_transform

source:
  doc: examples/lobbymap/stages/03_evidence_extraction.md
  section: "§3.3, Table 4"
  lines: [253, 262]

inputs:
  - id: documents_corpus
    schema:
      primary_key: [doc_id]
      columns:
        - {name: doc_id, type: str, nullable: false}
        - {name: entity_id, type: str, nullable: false}
        - {name: source_class, type: str, nullable: false}
        - {name: body, type: str, nullable: false}
        - {name: published_at, type: datetime, nullable: false}
        - {name: url, type: str, nullable: true}

llm:
  model: claude-sonnet-4-6
  temperature: 0.0
  max_retries: 3
  response_format: json
  prompt_template: |
    You are reading a document about a company or industry association's
    engagement on climate policy. Extract every distinct PIECE of evidence
    that takes a position (explicit or implicit) on one of the policy
    queries below. Skip purely descriptive or operational content.

    Policy queries (return query_id):
      Q1  climate_science          — alignment with IPCC science
      Q2  energy_transition        — speed and direction of energy transition
      Q3  ghg_emissions            — emissions accounting & reduction
      Q4  energy_disclosure        — disclosure of climate risks/positions
      Q5  carbon_tax_pricing
      Q6  emissions_trading
      Q7  renewable_energy_policy
      Q8  energy_efficiency_policy
      Q9  fossil_fuel_subsidies
      Q10 transport_policy
      Q11 industry_specific_policy
      Q12 climate_lobbying_disclosure
      Q13 climate_lobbying_governance

    Document (entity_id={entity_id}, source_class={source_class},
    published_at={published_at}):
    ---
    {body}
    ---

    Return a JSON list, one object per evidence piece:
      [{{"query_id": "Q3", "quote": "...verbatim from text...",
         "stance_summary": "supports / opposes / mixed / unclear",
         "confidence": 0.0-1.0,
         "char_offset_start": int, "char_offset_end": int}},
       ...]

    Empty list if no policy-relevant evidence found.

output_schema:
  primary_key: [evidence_id]
  estimated_rows: 30000
  columns:
    - {name: evidence_id, type: str, nullable: false,
       description: "Generated as f'{doc_id}#{idx}'."}
    - {name: doc_id, type: str, nullable: false, source: passthrough}
    - {name: entity_id, type: str, nullable: false, source: passthrough}
    - {name: source_class, type: str, nullable: false, source: passthrough}
    - {name: published_at, type: datetime, nullable: false, source: passthrough}
    - {name: query_id, type: str, nullable: false,
       range: [Q1, Q2, Q3, Q4, Q5, Q6, Q7, Q8, Q9, Q10, Q11, Q12, Q13]}
    - {name: quote, type: str, nullable: false}
    - {name: stance_summary, type: str, nullable: false,
       range: [supports, opposes, mixed, unclear]}
    - {name: confidence, type: float, nullable: false, range: [0.0, 1.0]}
    - {name: char_offset_start, type: int, nullable: true}
    - {name: char_offset_end, type: int, nullable: true}

eval:
  reference: examples/lobbymap/eval_data/evidence_extraction_gold.csv
  reference_schema:
    primary_key: [doc_id, expected_query_id]
    columns:
      - {name: doc_id, type: str}
      - {name: expected_query_id, type: str}
      - {name: expected_count_min, type: int}
      - {name: expected_count_max, type: int}
  join_on: [doc_id]
  metrics:
    - per_query_recall
    - per_query_precision
    - taxonomy_confusion_13x13
  notes: |
    Eval pattern: hand-label a small set of documents with their expected
    (query_id, quote) pairs. The metric isn't exact-match — it's whether
    the LLM finds the same set of policy-relevant pieces a human would.

review:
  when: "confidence < 0.6"
  routing: 1-of-1
  rationale: |
    Low-confidence extractions propagate downstream into scoring; even a
    light human pass on the low-confidence subset materially improves
    cell-aggregation quality.

compiler_notes:
  - "Methodology references 14 queries (line 254) but Table 4 enumerates 13.
     Treating Table 4 as canonical."
  - "Char offsets are nullable because some upstream document formats (PDFs
     with OCR, scraped HTML) don't preserve clean offsets. Real production
     pipeline should improve upstream parsing rather than work around here."
