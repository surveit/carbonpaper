id: cell_weights
name: Sector × source × query weight table (config)
type: input_data

source:
  doc: examples/lobbymap/stages/07_org_score_intensity.md
  section: "§4.7"
  lines: [353, 365]

connector:
  kind: file
  params:
    path: examples/lobbymap/static/cell_weights.csv
    format: csv
  refresh: ad_hoc
  notes: |
    Methodology specifies sector-specific weighting (e.g., automotive weights
    Q11 higher) but does not publish the actual weight numbers. This is the
    methodology authors' lever — change the file, re-run org_score, see effect.

output_schema:
  primary_key: [sector, source_class, query_id]
  estimated_rows: 200
  columns:
    - {name: sector, type: str, nullable: false}
    - {name: source_class, type: str, nullable: false}
    - {name: query_id, type: str, nullable: false}
    - {name: weight, type: float, nullable: false, range: [0.0, 10.0]}
