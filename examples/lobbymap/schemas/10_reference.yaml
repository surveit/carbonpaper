  - {name: name, type: str, nullable: false}
  - {name: sector, type: str, nullable: false, description: "v1: oil_and_gas"}
  - {name: hq_country, type: str, nullable: true}
  - {name: lobbymap_slug, type: str, nullable: true, description: "URL slug on lobbymap.org/company/, for scraping ground truth"}
---
name: influencer
title: Scored influencer (industry association)
kind: reference
description: |
  Industry associations — InfluenceMap's "influencers" — a SEPARATE universe from
  companies (mirroring their CMS: /company/... vs /influencer/...). Each influencer
  gets its own scoring matrix on the same queries, the same way a company does. v1
  set = the trade bodies the oil & gas companies fund (API, IOGP, FuelsEurope,
  Hydrogen Europe, Ipieca, Cefic, ...). The company<->influencer funding edge is
  conduct-layer scope; when added it references company on one side and influencer
  on the other, so it can ONLY be cross-kind by construction.
source:
  doc: examples/lobbymap/RESEARCH.md
  ref: "https://lobbymap.org/influencer/American-Petroleum-Institute-API"
primary_key: [influencer_id]
estimated_rows: 40
columns:
  - {name: influencer_id, type: str, nullable: false}
  - {name: name, type: str, nullable: false}
  - {name: region, type: str, nullable: true}
  - {name: lobbymap_slug, type: str, nullable: true, description: "URL slug on lobbymap.org/influencer/, for scraping ground truth"}
