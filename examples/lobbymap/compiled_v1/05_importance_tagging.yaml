id: importance_tagging
name: Importance + tag assignment
type: tag_metadata

source:
  doc: examples/lobbymap/stages/05_importance_tagging.md
  section: "§4.4 (tail) – §4.5 (head)"
  lines: [331, 337]

inputs:
  - evidence_extraction

parameters:
  model: claude-sonnet-4-6

  tag_fields:
    importance:
      type: integer
      range: [0, 10]
      description: |
        Relative significance of this evidence piece compared to others
        from the same data source that cover the same policy issue.
        Distinguishes high-level statements with limited potential impact
        (low) from direct, detailed engagement with policymakers (high).
        Cell-relative semantic per prose; recorded as a raw 0–10.
    region:
      type: string
      description: |
        Geographic region the evidence pertains to (e.g., "EU", "US",
        "Japan", "Global"). Taxonomy not specified in prose — left open.
    date:
      type: date
      format: ISO-8601 (YYYY-MM-DD; partial dates allowed YYYY-MM, YYYY)
      description: |
        Date of the evidence item (publication, statement, filing date).
    policy_tags:
      type: list[string]
      description: |
        Specific policies/laws referenced (e.g., "EU Fit for 55",
        "US Inflation Reduction Act"). Open-ended controlled vocabulary.
    technology_tags:
      type: list[string]
      description: |
        Technologies referenced (e.g., "CCS", "hydrogen", "EVs", "wind").
    fuel_tags:
      type: list[string]
      description: |
        Fuel types referenced (e.g., "coal", "natural gas", "oil").
    theme_tags:
      type: list[string]
      description: |
        Cross-cutting themes (e.g., "environmental justice",
        "just transition"). Open-ended.
    manual_flag:
      type: boolean
      description: |
        Strategically pivotal evidence — "flag or star" designation per
        prose. Marks items showing high-significance strategic policy
        engagement, either highly supportive or oppositional. Per our
        analysis this judgement is inherently human; the LLM may
        propose a candidate value but routing in `review:` below sends
        every candidate-flagged item to human queue for confirmation.
    flag_polarity:
      type: enum
      values: [supportive, oppositional, none]
      description: |
        If manual_flag is true, the direction of strategic engagement.
        "none" when manual_flag is false.

  prompt_template: |
    You are tagging a single piece of evidence from a corporate climate
    policy engagement dataset (LobbyMap methodology). Read the evidence
    and produce structured tags.

    EVIDENCE:
    {evidence_text}

    SOURCE: {source_url}
    DATA_SOURCE_TYPE: {data_source_type}
    POLICY_ISSUE: {policy_issue}
    ORGANIZATION: {organization}

    For each field below, produce the value or null/empty if not
    determinable from the evidence:

    1. importance (integer 0–10): Relative significance of THIS piece
       compared to typical evidence from the same data source covering
       the same policy issue. Anchors:
         0–2  = passing mention, boilerplate, indirect signal
         3–5  = clear position but high-level / general statement
         6–8  = direct engagement (consultation submission, lobbying
                meeting record, detailed policy comment)
         9–10 = strategically pivotal direct engagement with policymakers
                (e.g., named lobbying on a live legislative file)

    2. region: Geographic scope of the evidence. Use country/bloc names
       ("EU", "US", "Japan", "Global"). One value.

    3. date: ISO-8601 date of the evidence (publication or statement
       date). Partial dates OK.

    4. policy_tags: Specific named policies/laws referenced.
       Empty list if none.

    5. technology_tags: Specific technologies referenced.

    6. fuel_tags: Fuel types referenced.

    7. theme_tags: Cross-cutting themes (e.g., "environmental justice",
       "just transition").

    8. manual_flag (boolean) and flag_polarity (supportive/oppositional/
       none): Set manual_flag=true ONLY if this evidence appears to show
       strategically pivotal engagement — either highly supportive of, or
       highly oppositional to, science-aligned climate policy. This is a
       CANDIDATE flag; a human reviewer will make the final call. When in
       doubt, flag it (false negatives are worse than false positives
       here because human review is the ground truth).

    Return JSON matching the output schema. Quote the span of the
    evidence that most supports the importance score in `importance_quote`.

  output_schema:
    type: object
    properties:
      evidence_id: {type: string}
      importance: {type: integer, minimum: 0, maximum: 10}
      importance_quote: {type: string}
      region: {type: string, nullable: true}
      date: {type: string, format: date, nullable: true}
      policy_tags: {type: array, items: {type: string}}
      technology_tags: {type: array, items: {type: string}}
      fuel_tags: {type: array, items: {type: string}}
      theme_tags: {type: array, items: {type: string}}
      manual_flag: {type: boolean}
      flag_polarity:
        type: string
        enum: [supportive, oppositional, none]
      tagging_reasoning: {type: string}

outputs:
  tagged_evidence:
    type: list
    items:
      evidence_id: str
      importance: int
      importance_quote: str
      region: str
      date: str
      policy_tags: list[str]
      technology_tags: list[str]
      fuel_tags: list[str]
      theme_tags: list[str]
      manual_flag: bool
      flag_polarity: str  # supportive | oppositional | none
      tagging_reasoning: str

eval:
  reference: examples/lobbymap/eval_data/tagged_evidence.csv
  ground_truth_field: human_tags
  metrics:
    - importance_mae         # mean absolute error on the 0–10 scale
    - importance_within_1    # share of items where |LLM - human| <= 1
    - region_agreement       # exact match
    - date_agreement         # exact match on ISO date (or month/year)
    - tag_set_f1             # F1 over union of policy/tech/fuel/theme tags
    - flag_recall            # share of human-flagged items the LLM also flagged
    - flag_precision         # share of LLM-flagged items the human confirmed
  notes: |
    The user assembles this CSV by sampling ~200 evidence pieces from
    historical LobbyMap output (or a hand-tagged seed set) and recording
    human-assigned values for every tag_field. Importance MAE is the
    headline metric; tag_set_f1 catches taxonomy drift; flag_recall is
    the safety metric (we'd rather over-flag for human review than miss
    pivotal items).

review:
  when: "manual_flag == true"
  routing: "1-of-1"
  rationale: |
    Per our prior analysis, the flag/star designation in the prose
    ("highlight positive and negative evidence pieces of high
    significance to the system's users... strategic policy engagement
    in either a highly supportive or oppositional manner") is an
    inherently human judgement. It encodes editorial significance to
    "the system's users" — not a property the LLM can score from text
    alone. The LLM proposes candidates; a human confirms or rejects
    every candidate before the flag is persisted downstream (Stage 6
    intensity, Stage 7 Engagement Intensity).

    Importance, region, date, and the open-vocabulary tags do NOT
    require per-item review — they are auto-taggable and governed by
    the eval block above. If eval metrics drop below threshold, the
    user can broaden review to "always" via the runtime knob.

compiler_notes:
  - "Input chosen as `evidence_extraction` (Stage 3) rather than
    `benchmark_scoring` (Stage 4). Prose §4.4–§4.5 says tagging is
    applied 'in addition to the scoring process above', which reads as
    a parallel annotation pass on the same evidence items, not a
    downstream consumer of the scores. Either ordering would work at
    runtime — Stage 6 cell aggregation pulls from both — but tagging
    has no data dependency on the score, so the shorter dependency
    chain (extract → tag) is cleaner. Reviewer can swap the input to
    [evidence_extraction, benchmark_scoring] if scoring context turns
    out to be useful for importance calibration."
  - "Modeled the flag/star as a `review:` block on this stage rather
    than a separate `human_review` stage. Rationale: per SCHEMA.md,
    review routing belongs on the producing stage; the queue itself is
    only spun out as `human_review` when there is meaningful queue
    state (batching, multiple reviewers, conflict resolution). Here
    every candidate flag is a single 1-of-1 confirmation gate. If the
    user wants reviewer-load balancing or 2-of-2 routing later, this
    can be promoted to a dedicated Stage 5b human_review stage."
  - "Model defaulted to `claude-sonnet-4-6` for the whole stage.
    Tradeoff: `gpt-4o-mini` would be ~10–20x cheaper per item and the
    methodology runs ~30,000 evidence pieces/year (line 22 of prose
    chunk), so cost is non-trivial. However, importance scoring is the
    metric with the highest downstream leverage (it weights everything
    in Stage 6 cell aggregation and Stage 7 intensity), and the
    open-vocabulary tag fields benefit from a stronger model for
    consistency. Recommendation if cost matters: split into two
    sub-prompts — `gpt-4o-mini` for region/date/tags (cheap, mostly
    extractive) and `claude-sonnet-4-6` for importance + flag candidate
    (judgement-heavy). Left as a single-model stage for v1
    simplicity."
  - "Tag vocabularies (policy_tags, technology_tags, fuel_tags,
    theme_tags) are open-ended in the prose — the methodology gives
    examples ('environmental justice', 'just transition') but no
    closed list. Modeled as free-form list[string]. Downstream
    (Stage 6) will need a normalization step or the user will need to
    supply a controlled vocabulary file. Flagged as a known ambiguity
    in the prose chunk's compiler notes (lines 36–40)."
  - "Importance is described as 'relative to others from the same data
    source that cover the same policy issue.' The prose chunk's own
    compiler notes (line 37) flag the ambiguity: is the LLM supposed
    to (a) score absolutely on a 0–10 anchor and let downstream
    normalize, or (b) actually be shown the cohort and score
    relatively? Modeled as (a) with anchored 0–10 rubric in the
    prompt — the cohort-relative semantic is preserved by feeding
    `policy_issue` and `data_source_type` into the prompt as context.
    True cohort-relative scoring would require a different stage type
    (batch-scoring) and is left for a future revision."
  - "Date taxonomy (ISO-8601, partial dates allowed) and region
    taxonomy (free-form country/bloc) are compiler choices — prose
    does not specify either (per the prose chunk's notes, line 40)."
  - "`flag_polarity` was added even though the prose conflates
    'flag or star' as one construct. Rationale: prose explicitly
    distinguishes 'highly supportive' vs 'oppositional' as the two
    semantic cases, and downstream Stage 7 Engagement Intensity is
    sign-sensitive. If the user prefers a single signed flag
    (-1/0/+1), this collapses trivially."
