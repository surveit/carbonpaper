id: universe_selection
name: Universe selection
type: ingest_universe

source:
  doc: examples/lobbymap/stages/01_universe_selection.md
  section: "§3.4"
  lines: [263, 279]

inputs: []

parameters:
  description: |
    Define the scoring universe for the LobbyMap platform: the set of
    companies and industry associations ("influencers") whose climate
    policy engagement will be assessed by downstream stages. As of
    September 2024 the universe contains approximately 600 companies
    and 300 leading industry groups, with a stated objective of reaching
    1000 companies in 2025.
  sources:
    - name: Forbes Global 2000
      kind: external_ranking
      notes: |
        Used as the primary size-and-influence ranking. Companies are
        selected based on the average of their Forbes Global 2000 rank
        over the past three years.
    - name: Corporate climate-initiative memberships
      kind: screening_aggregator
      notes: |
        Methodology references "screening and aggregating memberships in
        corporate climate initiatives worldwide" as a secondary inclusion
        signal for companies in any sector. Specific initiatives are not
        enumerated in the prose.
    - name: Stakeholder survey (businesspeople, policymakers, civil society)
      kind: qualitative_survey
      notes: |
        Used for industry-association selection to assess jurisdictional
        influence. Methodology of the survey itself is not formalized in
        the prose.
  filters:
    companies:
      size_filter: |
        Average Forbes Global 2000 rank over the past 3 years.
        Distribution targets: ~50% of database ranks higher than 500;
        ~70% ranks higher than 1000.
      sector_emphasis:
        - energy
        - utilities
        - transport
        - heavy_industry_chemicals
        - heavy_industry_steel
        - heavy_industry_cement
        - mining
        - agriculture
      cross_sector_inclusion: |
        Companies from any sector flagged as potentially engaged on
        climate policy via screening and aggregating memberships in
        corporate climate initiatives worldwide.
      focus_regions:
        - Canada
        - United States
        - Europe
        - South Korea
        - Japan
        - Australia
      expansion_regions:
        - China
        - Brazil
        - India
        - Indonesia
        - Mexico
        - South Africa
      finance_sector_note: |
        Finance-sector companies are included with a slightly modified
        methodology described in Appendix B (lines 428-433). Selection
        logic is the same; query/scoring details differ downstream.
    industry_associations:
      criteria:
        - id: sector_relevance
          description: |
            Assessment of the relevance of climate issues to the industry
            group and how active the group is likely to be on climate
            change matters. Prioritizes groups representing key climate
            sectors (energy, utilities, transport, industrial, heavy
            industry — chemicals, steel, cement — and agriculture).
            Cross-sector business federations (e.g., the US Chamber of
            Commerce) and issue-specific cross-sector groups (e.g., an
            "energy-intensive industry alliance") are treated as highly
            significant.
        - id: jurisdictional_influence
          description: |
            Estimation of the industry group's influence within its
            jurisdiction (e.g., US, EU, Japan, or international). Factors
            in the group's size and the size and significance of the
            companies or sectors it represents. Conducted by surveying
            and aggregating perspectives of businesspeople, policymakers,
            and civil society groups familiar with the jurisdiction.
        - id: jurisdiction_weighting
          description: |
            Accounts for the size of the economy and the contribution of
            the industry group's jurisdiction to global greenhouse gas
            emissions and exported fossil fuels. No closed-form weighting
            formula is given in the prose.
  estimated_size:
    companies_current: 600
    industry_groups_current: 300
    companies_target_2025: 1000
    as_of: "2024-09"

outputs:
  companies:
    type: list
    description: |
      The set of companies in the LobbyMap scoring universe. Each entry
      should carry enough identity and metadata for downstream stages
      (source ingestion, evidence extraction, aggregation, relationship
      graph) to operate against it.
    items:
      company_id: str
      canonical_name: str
      aliases: list
      hq_country: str
      hq_region: str
      sectors: list
      forbes_global_2000_avg_rank_3y: float
      inclusion_reason: str   # e.g. "size", "sector", "climate_initiative_membership", "expansion_region"
      is_finance_sector: bool
  industry_associations:
    type: list
    description: |
      The set of industry associations / "influencers" tracked. Feeds
      Stage 8 (relationship_graph) which needs the influencer roster to
      build company<->association edges, and feeds Stage 2
      (source_ingestion) which collects documents per influencer.
    items:
      influencer_id: str
      canonical_name: str
      aliases: list
      jurisdiction: str
      sectors_represented: list
      is_cross_sector_federation: bool
      jurisdiction_weight: float    # per "jurisdiction weighting" criterion; may be qualitative
      influence_assessment: str     # qualitative summary from stakeholder survey

compiler_notes:
  - "Stage type chosen: `ingest_universe`. The prose defines the scoring entity set without prescribing automated fetching beyond reference to the Forbes Global 2000 list, so this fits the deterministic universe-definition role."
  - "The universe contains TWO entity classes (companies and industry associations) with different selection criteria. Modeled both inside one `ingest_universe` stage because the schema only defines one universe-ingest type and downstream stages clearly treat them as a single combined universe. An alternative compilation would split this into two stages (`universe_selection_companies` and `universe_selection_associations`); flagged for human review."
  - "Forbes Global 2000 is referenced as the size signal but no source URL or licensed data feed is named. Treated as an `external_ranking` placeholder; the user will need to wire up an actual data source (or a manual upload) at runtime."
  - "The 'climate-initiative membership' screen is mentioned as an inclusion criterion but the specific initiatives (CDP, Climate Action 100+, SBTi, RE100, etc.) are NOT enumerated in the prose. Left as a free-text criterion; a follow-up methodology pass should enumerate the initiatives and the screening rule."
  - "Numerical thresholds for sector tagging and climate-relevance flags are not given in the prose. The 50% / 70% Forbes-rank distribution figures are reported as descriptive statistics of the existing database, not as hard inclusion thresholds — captured under `size_filter` as targets rather than gates."
  - "The 'jurisdiction weighting' for industry associations is described qualitatively only (economy size + GHG contribution + exported fossil fuels). No formula. Captured as a qualitative criterion; if Stage 8 (relationship_graph) needs a numeric jurisdiction weight, that derivation should be made explicit there or in a dedicated `compute_score` stage."
  - "Finance sector uses a modified methodology per Appendix B (lines 428-433). Selection logic is the same per the prose, so a single `is_finance_sector` flag is emitted on each company so downstream stages can branch. No separate finance-universe stage was created."
  - "No LLM step is implied by the methodology for universe selection itself, so no `eval` block is included. (The stakeholder-survey input for industry-association influence is human-judgmental but not algorithmic; treating it as out-of-band curation rather than an LLM stage.)"
  - "No `review` block added: the prose does not call for per-record human review of the universe roster, and the universe is itself a curated artifact (not a high-volume LLM output with asymmetric error cost). The roster is implicitly human-curated."
  - "`inputs: []` because this is the head of the DAG. Downstream consumers per `examples/lobbymap/stages/README.md` and the cross-references in the prose chunk: Stage 2 (source_ingestion) consumes both companies and industry_associations; Stage 8 (relationship_graph) consumes industry_associations specifically."
  - "Expansion regions (China, Brazil, India, Indonesia, Mexico, South Africa) are listed as a stated future-growth area, not as currently-included regions. Captured under `expansion_regions` separate from `focus_regions` so the user can decide at runtime whether expansion-region companies are in or out of scope for a given run."
