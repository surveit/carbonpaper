id: indirect_performance_band
name: Indirect score + Performance Band
type: compute_score

source:
  doc: examples/lobbymap/stages/09_indirect_performance_band.md
  section: "§2.3 (Performance Band row), §4.1 final, §4.9 final"
  lines: [218, 219]

inputs:
  - org_score_intensity
  - relationship_graph

parameters:
  formula: |
    For COMPANIES:
      total_score = combine(Organisation_Score, Relationship_Score)
      # Prose (§2.3): "the 'Organisation Score' and 'Relationship Score' are
      # combined to result in a total score that places the company in a
      # Performance Band." The combination function is NOT specified in
      # closed form. Default placeholder: equal-weighted mean
      #   total_score = 0.5 * Organisation_Score + 0.5 * Relationship_Score
      # This is a heuristic stand-in; the real weighting must be confirmed
      # against InfluenceMap's published results. See compiler_notes.

    For INDUSTRY ASSOCIATIONS:
      total_score = Organisation_Score
      # Prose explicitly: "Industry associations do not have a 'Relationship
      # Score', so the Performance Band for industry associations is made
      # up of only the 'Organisation Score'." (line 218; footnote line 219)

    Performance Band assignment (band_for_score(total_score)):
      total_score >= 95   -> "A+"   # explicit anchor in prose
      total_score >= 25   -> "E-"   # explicit anchor in prose (lower bound)
      total_score <  25   -> "F"    # explicit: "<25% falling in the red 'F' band"
      otherwise           -> one of the 14 intermediate bands in the
                             A+..E- ladder (A, A-, B+, B, B-, C+, C, C-,
                             D+, D, D-, E+, E) — exact bin edges NOT
                             enumerated in prose. See compiler_notes.

    N/A rule:
      if Organisation_Score is "n/a" AND (entity is association
                                          OR Relationship_Score is "n/a"):
          band = "n/a"
      # Prose only addresses the BOTH-n/a case explicitly. The mixed case
      # (one available, one n/a) is unstated. See compiler_notes.

    Semantic bands (informational, from prose):
      A+ to B (>75%) -> "broad support for science-aligned policy"
      D  to F (<50%) -> "increasingly obstructive climate policy engagement"
      (50–75%, i.e. roughly C-band, treated as mixed by analogy with
      Relationship Score prose, which calls 50–75 "mixed engagement")

  inputs_used:
    - source: org_score_intensity
      fields:
        - Organisation_Score          # 0–100, may be "n/a" if intensity < 5
        - Engagement_Intensity        # informational; suppression already
                                      # applied upstream in Stage 7
        - entity_type                 # company | industry_association
    - source: relationship_graph
      fields:
        - Relationship_Score          # 0–100, companies only; may be "n/a"
        - relationship_evidence_count # used to decide n/a propagation

  output_range:
    type: ordinal
    values:
      - "A+"
      - "A"
      - "A-"
      - "B+"
      - "B"
      - "B-"
      - "C+"
      - "C"
      - "C-"
      - "D+"
      - "D"
      - "D-"
      - "E+"
      - "E"
      - "E-"
      - "F"
      - "n/a"
    anchors_from_prose:
      "A+": [95, 100]
      "E-": [25, 30]
      "F":  [0, 25]
    intermediate_bins: |
      The 14 bands between A+ and E- are NOT enumerated in the prose. The
      most natural reading (16 total bands, A+=95–100, E-=25–30, F is its
      own wider <25 bin, intermediate bands of 5 percentage points each)
      yields:
        A+ : 95–100
        A  : 90–95
        A- : 85–90
        B+ : 80–85
        B  : 75–80
        B- : 70–75
        C+ : 65–70
        C  : 60–65
        C- : 55–60
        D+ : 50–55
        D  : 45–50
        D- : 40–45
        E+ : 35–40
        E  : 30–35
        E- : 25–30
        F  : 0–25
      This layout is INFERRED, not stated. See compiler_notes.

outputs:
  performance_band:
    type: list
    description: |
      One Performance Band assignment per organization in the universe
      (companies AND industry associations). This is the final
      user-facing grade.
    items:
      organization_id: str
      entity_type: str              # "company" | "industry_association"
      organisation_score: float     # 0–100 or "n/a"
      relationship_score: float     # 0–100 or "n/a" (associations: always n/a)
      total_score: float            # combined score; "n/a" if band is "n/a"
      performance_band: str         # one of output_range.values
      band_semantic: str            # "supportive" | "mixed" | "obstructive" | "n/a"
      contributing_inputs:
        org_score_source: str       # stage id, for traceability
        relationship_score_source: str

review:
  when: "always"
  routing: "1-of-1"
  rationale: |
    This is the final, user-facing grade for each organization in the
    LobbyMap universe. Reputational and legal exposure for a wrongly
    assigned obstructive band (D–F) is high, so every band assignment
    should be eyeballed before publication, even though the computation
    itself is deterministic. Compounding factor: the combination formula
    and intermediate band edges are not nailed down in the prose
    (see compiler_notes), so the deterministic output is only as
    trustworthy as the assumptions encoded above.

compiler_notes:
  - "PROSE UNDERSPECIFIED — combination formula. §2.3 says Organisation
    Score and Relationship Score are 'combined to result in a total
    score' but does not give the combination function or weights.
    Defaulted to equal-weighted mean (0.5/0.5) as a placeholder. A human
    must confirm against InfluenceMap's published company grades, or
    obtain the formula from InfluenceMap directly, before this stage can
    be considered correct."
  - "PROSE UNDERSPECIFIED — intermediate band layout. The methodology
    explicitly anchors only A+ (95–100) and E- (25–30), and asserts
    there are 16 bands total with F covering <25. The 14 intermediate
    bands (A, A-, B+, B, B-, C+, C, C-, D+, D, D-, E+, E) and their
    exact 5-point edges are inferred by the compiler. The implied
    layout is consistent with the count (A+ + 14 + E- + F = 17 — note
    this is one MORE than 16, so either 'F' is being counted as a band
    or one of A-through-E- collapses. The chosen layout treats F as
    one of the 16 and still gives a clean 5-point bin per band; an
    alternative reading is that F is outside the '16 bands' count.)
    Human review required."
  - "PROSE UNDERSPECIFIED — N/A propagation. The methodology only
    states that the band is 'n/a' when BOTH Organisation Score and
    Relationship Score lack evidence. Behavior when only ONE of the two
    is n/a is unstated. The compiled rule above conservatively keeps
    the band computable when Organisation Score is present (since
    industry associations work that way already), but a human must
    decide the policy for companies with direct evidence but no
    industry-association links, and vice versa."
  - "Bin boundary convention (>= vs >) is not specified by the prose
    and was chosen as half-open intervals [lower, upper) with the top
    band A+ closed at 100. Edge scores at exact 5-point boundaries
    (e.g. 75.0, 50.0) are sensitive to this convention."
  - "Engagement Intensity does not directly feed this stage, but
    Stage 7 (org_score_intensity) suppresses Organisation Score to
    n/a when intensity < 5. That suppression propagates here via the
    n/a rule. Documented for traceability; no extra logic needed."
  - "Stage type is `compute_score` because the operation is a
    deterministic reduce of two upstream numeric inputs into a band.
    No LLM involved, hence no eval block. The non-trivial review block
    is justified by the asymmetric reputational cost of a wrong final
    grade, not by stage uncertainty."
  - "Downstream: this stage is the terminal computation. A `publish`
    stage (e.g. evidence_cards or html_report) should consume
    `performance_band` to render company/association profiles. Not
    constructed here per the build instructions."
