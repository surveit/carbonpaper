id: org_score_intensity
name: Org Score + Engagement Intensity computation
type: compute_score

source:
  doc: examples/lobbymap/stages/07_org_score_intensity.md
  section: "§2.3 (Table 2), §4.7, §4.8"
  lines: [218, 365]

inputs:
  - cell_aggregation

parameters:
  formula: |
    Two metrics produced per organization, both on a 0–100 scale.

    (1) Organization Score (0–100) — alignment-weighted aggregation of cell scores.
        org_score = normalize_to_0_100(
          Σ_cells ( cell_score * cell_weight )
          over cells that have evidence newer than 5 years
        )
        where cell_score is the per-cell aggregate from Stage 6 (cell_aggregation),
        and cell_weight = data_source_weight(D) * query_weight(Q) * sector_modifier(sector, Q, D),
        with cell weights renormalized so Σ cell_weight == 100% after dropping
        N/S, N/A, and stale (>5y) cells (redistributed equally within each query row).

        Score bands (interpretive, not computational):
          [0, 50)   -> increasingly significant misalignment with Paris-aligned policy
          [50, 75]  -> mixed engagement
          (75, 100] -> broad consistency with science-aligned policy
          n/a       -> emitted when limited evidence has been collected, OR when
                       Engagement Intensity < 5 (see gating rule below).

    (2) Engagement Intensity (0–100) — policy-position-agnostic activity measure.
        engagement_intensity = normalize_to_0_100(
          Σ_cells ( cell_intensity * cell_weight )
        )
        where cell_intensity is the sum of per-evidence "evidence intensity" values
        within the cell (evidence intensity is derived from the |score|, importance,
        flags, and age of each evidence item — produced upstream in Stage 6).

        Intensity bands (interpretive):
          < 5    -> entity is NOT attributed an Organization Score (gates output 1)
          < 12   -> relatively limited engagement
          12–25  -> active engagement
          > 25   -> highly active / strategic engagement

    Gating: if engagement_intensity < 5, org_score is emitted as "n/a".

  inputs_used:
    - cell_aggregation.cells[].cell_score        # from Stage 6
    - cell_aggregation.cells[].cell_intensity    # from Stage 6
    - cell_aggregation.cells[].data_source_id    # D1..D8
    - cell_aggregation.cells[].query_id          # Q1..Q11 (or Q1..Q13 per Table 4)
    - cell_aggregation.cells[].most_recent_evidence_date
    - cell_aggregation.cells[].status            # scored / N/S / N/A
    - organization.sector                        # selects sector weight profile

  output_range:
    org_score: "0–100 or 'n/a'"
    engagement_intensity: "0–100"

  weights_config:
    # Numerical weights are NOT given in the prose; they live in an external config
    # the runtime loads at compute time. The prose only specifies the ordinal
    # ranking and the redistribution rule.
    config_path: examples/lobbymap/config/cell_weights.yaml  # to be authored
    schema:
      data_source_weights:
        D4: "highest tier (regulatory consultations)"
        D6: "highest tier (management messaging)"
        # remaining D1, D2, D3, D5, D7, D8: lower tiers, exact values TBD
      query_weights:
        # §4.7 says policy-specific queries Q5–Q9 weighted higher than Q1–Q4
        # §4.8 says policy-specific queries Q6–Q11 weighted higher than Q1–Q4
        # Prose is internally inconsistent on the index range; treat the
        # partition (policy-specific > high-level) as the binding rule.
        high_level_queries: "lower tier (Q1–Q4)"
        policy_specific_queries: "higher tier (Q5–Q9 per §4.7, or Q6–Q11 per §4.8)"
      sector_modifiers:
        # Example from prose: automotive sector boosts Q11 (GHG Emissions Standards)
        # because it covers vehicle emissions standards. Full sector→cell mapping
        # is not provided in the prose.
        automotive:
          Q11: "boosted (vehicle emissions standards)"
        # other sectors: TBD by methodology config

  redistribution_rule: |
    When a cell is marked N/S (Not Scored), N/A (Not Applicable), or has no
    evidence newer than 5 years, its weight is redistributed equally among the
    remaining scored cells in the SAME query row. After redistribution, the
    sum of cell weights across the included matrix equals 100%.

  recency_cutoff_years: 5

  intensity_thresholds:
    no_org_score_below: 5
    limited_below: 12
    active_above: 12
    strategic_above: 25

  org_score_bands:
    misaligned_below: 50
    mixed_range: [50, 75]
    supportive_above: 75

outputs:
  org_metrics:
    type: list
    description: |
      One record per organization in the universe. This is the headline output
      consumed by Stage 8 (Relationship Score, which reuses industry-association
      org_score values) and Stage 9 (Performance Band, which combines org_score
      with the indirect/relationship score). It is also the primary public-facing
      number on the LobbyMap profile.
    items:
      organization_id: str
      sector: str
      org_score:
        type: "float | 'n/a'"
        range: [0, 100]
        description: |
          0–100 alignment score. 'n/a' when engagement_intensity < 5 or when
          available evidence is too sparse to support a score.
      org_score_band: "enum: misaligned | mixed | supportive | n/a"
      engagement_intensity:
        type: float
        range: [0, 100]
      engagement_intensity_band: "enum: limited | active | strategic"
      cells_included_count: int
      cells_excluded_stale_count: int
      cells_excluded_ns_na_count: int
      effective_weights:
        type: dict
        description: |
          The renormalized per-cell weights actually used in this organization's
          calculation (after N/S, N/A, and >5y exclusions and redistribution).
          Sum equals 1.0 (or 100%).
      computed_at: datetime

compiler_notes:
  - "CRITICAL UNDERSPECIFICATION: The prose names the inputs (cell scores, cell intensities, cell weights), the weighting ranks (D4/D6 highest; policy queries > high-level queries), and the redistribution rule, but does NOT give closed-form expressions for either the 0–100 normalization function for Organization Score or for Engagement Intensity. The `formula` block above sketches a weighted-sum-then-rescale, but a human methodologist must specify the actual rescaling (e.g., affine map from cell_score range -2..+2 to 0..100, or a different transform) before this stage can run deterministically. Flagged as the single largest gap in this stage's spec."
  - "Sector-specific weighting IS mentioned in the prose (automotive boosts Q11 / GHG Emissions Standards) but the actual sector→cell weight table is not enumerated. Pushed to an external `cell_weights.yaml` config; the stage is deterministic but data-driven, and that config file is a separate authorship deliverable. The prose only gives one example (automotive)."
  - "Numerical weights for D1..D8 and Q1..Q11 are not provided — only the ordinal ranking (D4, D6 highest among data sources; policy-specific queries higher than high-level queries). Config file will need to be calibrated; until then, sensible defaults (e.g., D4=D6=2x other sources, policy queries=2x high-level queries) are reasonable starting points but should be flagged."
  - "Query-index inconsistency in the source prose: §4.7 says 'policy-specific queries (Q5–Q9)' while §4.8 says '(Q6–Q11)'. Both passages refer to the same partition concept (policy-specific > high-level) but disagree on the index range. Treated the partition as binding and the index range as advisory; downstream config should resolve against the actual query catalog (Table 4)."
  - "Engagement Intensity gating: prose says 'Entities with Engagement Intensity scores below 5 are not attributed an Organization Score.' Implemented as an explicit gate that emits org_score='n/a' when intensity<5. There is also a separate 'limited evidence' n/a path mentioned in §2.3 but no quantitative threshold for it — left as a soft criterion to be specified."
  - "5-year recency cutoff and the 'redistribute weight within the query row' rule for N/S and N/A cells are explicit in the prose and encoded directly. These two interact: a cell can be excluded for staleness OR for status, both trigger the same redistribution mechanism."
  - "No `eval` block: this is a deterministic formula stage; correctness is verified by unit tests against known InfluenceMap outputs, not by ground-truth agreement metrics."
  - "No `review` block: deterministic computation, no LLM, no per-item judgment to QA. Human review of the WEIGHT CONFIG and of the NORMALIZATION FORMULA is needed but happens at methodology-authoring time, not at runtime per organization."
  - "This stage's output (org_score, engagement_intensity) is the headline LobbyMap number — most downstream consumers (Stage 8 relationship graph, Stage 9 performance band, public profile pages) read from here. Treat schema stability of `org_metrics[]` as a contract."
