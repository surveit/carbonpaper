id: benchmark_scoring
name: Score evidence against benchmark on the 5-point rubric
type: llm_transform

source:
  doc: examples/lobbymap/stages/04_benchmark_scoring.md
  section: "§4.2 (Table 6)"
  lines: [292, 310]

inputs:
  - id: evidence_with_benchmarks
    schema:
      primary_key: [evidence_id, benchmark_id]
      columns:
        - {name: evidence_id, type: str, nullable: false}
        - {name: entity_id, type: str, nullable: false}
        - {name: query_id, type: str, nullable: false}
        - {name: quote, type: str, nullable: false}
        - {name: benchmark_id, type: str, nullable: false}
        - {name: benchmark_text, type: str, nullable: false}
        - {name: kind, type: str, nullable: false}
        - {name: jurisdiction, type: str, nullable: true}

llm:
  model: claude-sonnet-4-6
  temperature: 0.0
  max_retries: 3
  response_format: json
  prompt_template: |
    Score this piece of evidence against the benchmark on a 5-point scale.

    Evidence (verbatim quote from a {kind} source):
    "{quote}"

    Benchmark ({kind}):
    {benchmark_text}

    Policy query: {query_id}{jurisdiction_clause}

    Rubric (Table 6 of the LobbyMap methodology, applied verbatim):
      +2  Strongly supporting
            science_based:     "Detailed position aligned with IPCC analysis."
            government_policy: "Strong support for the policy and/or advocacy
                                that would strengthen the policy further."
      +1  Supporting
            science_based:     "Broad alignment with IPCC analysis."
            government_policy: "General or high-level support for the policy."
       0  No position / Mixed
            science_based:     "Unclear if position is aligned with IPCC analysis."
            government_policy: "Unclear if position is supportive of the policy."
      -1  Not supporting
            science_based:     "Position appears misaligned with IPCC analysis."
            government_policy: "Unsupportive of the policy and/or supportive
                                with caveats that would weaken the proposal."
      -2  Opposing
            science_based:     "Position contradicts IPCC analysis."
            government_policy: "Opposes the policy."

    For government_policy benchmarks: only apply if all four §4.4 conditions
    hold (specific clearly-communicated proposal from a mandated government
    body; close to original policy intent; jurisdiction still in Paris;
    proposal not at odds with IPCC). If any condition fails, decline to
    score against this benchmark and return precedence_failure: true.

    Return JSON:
      {{"score": -2|-1|0|1|2,
        "reasoning": "...one paragraph linking quote to rubric tier...",
        "precedence_failure": false}}

  rubric:
    "+2":
      label: Strongly supporting
      science_based: "Detailed position that is aligned with IPCC analysis"
      government_policy: "Strong support for the policy and/or advocacy that would strengthen the policy further"
    "+1":
      label: Supporting
      science_based: "Broad alignment with IPCC analysis"
      government_policy: "General or high-level support for the policy"
    "0":
      label: No position / Mixed position
      science_based: "Unclear if position is aligned with IPCC analysis"
      government_policy: "Unclear if position is supportive of the policy"
    "-1":
      label: Not supporting
      science_based: "Position appears misaligned with IPCC analysis"
      government_policy: "Unsupportive of the policy and/or with major weakening caveats"
    "-2":
      label: Opposing
      science_based: "Position contradicts IPCC analysis"
      government_policy: "Opposes the policy"

output_schema:
  primary_key: [evidence_id, benchmark_id]
  estimated_rows: 60000
  columns:
    - {name: evidence_id, type: str, nullable: false, source: passthrough}
    - {name: benchmark_id, type: str, nullable: false, source: passthrough}
    - {name: entity_id, type: str, nullable: false, source: passthrough}
    - {name: query_id, type: str, nullable: false, source: passthrough}
    - {name: kind, type: str, nullable: false, source: passthrough}
    - {name: score, type: int, nullable: true, range: [-2, 2],
       description: "Null when precedence_failure=true."}
    - {name: reasoning, type: str, nullable: false}
    - {name: precedence_failure, type: bool, nullable: false}

eval:
  reference: examples/lobbymap/eval_data/scored_evidence_gold.csv
  reference_schema:
    primary_key: [evidence_id, benchmark_id]
    columns:
      - {name: evidence_id, type: str}
      - {name: benchmark_id, type: str}
      - {name: human_score, type: int, range: [-2, 2]}
  join_on: [evidence_id, benchmark_id]
  metrics:
    - exact_agreement_rate
    - off_by_one_rate
    - signed_direction_agreement
    - mean_absolute_error
    - confusion_matrix_5x5
    - extreme_score_precision   # P/R restricted to |score|=2
  notes: |
    Use prior LobbyMap-coded evidence as ground truth. Even a few hundred
    examples per query is enough to detect calibration drift across model
    versions or prompt edits.

review:
  when: "abs(score) >= 2"
  routing: 1-of-2-disagreement-escalates
  rationale: |
    A false +2 launders weak supportive language as a leadership claim;
    a false -2 misattributes opposition. Both are reputationally expensive.
    All extreme scores get two reviewers; disagreement escalates to a third.

compiler_notes:
  - "Rubric pulled verbatim from Table 6. The dual-column structure (science_
     based + government_policy) is preserved so the prompt shows the LLM the
     exact tier descriptions for each benchmark kind."
  - "§4.4 precedence rule (when government_policy can override science_based)
     is encoded inside the prompt rather than in upstream join logic, because
     three of the four conditions require reading the evidence text."
  - "Multiple rows per evidence_id are normal — one per applicable benchmark.
     Downstream stages collapse this in cell aggregation."
