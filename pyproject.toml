# Tool configuration only — the app is run from source (uvicorn app.main:app),
# not installed as a package.
#
# Lint/typecheck scope: ruff respects .gitignore, so examples/ and saydo/
# (generated + scratch content) are skipped via the ignore file, not here.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's default select (E4, E7, E9, F) plus BLE (flake8-blind-except): never
# catch bare `except Exception`/`except:` — catch specific exception types.
select = ["E4", "E7", "E9", "F", "BLE"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
# No blanket ignore_missing_imports: pandas-stubs and types-PyYAML are installed
# via requirements-dev.txt, and the other deps ship their own types.

# pyarrow is the exception: its compiled `pyarrow.lib` extension ships no
# py.typed marker, so mypy can't analyze `import pyarrow` under CI (a locally
# installed marker masks this). Scope the exemption to pyarrow only.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Architecture boundaries, enforced by import-linter (`PYTHONPATH=. lint-imports`).
# The content-level companions live in tests/arch/.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Agent spine is domain-agnostic"
type = "forbidden"
source_modules = ["app.agent"]
forbidden_modules = ["app.compiler", "app.web", "app.services"]
# app.agent is a reusable chat/agent engine. It may use app.runtime (the LLM/CLI
# backend adapter) and core models, but must not import domain layers — so any
# agent can run on it. The dependency points the other way: app.compiler.agent
# imports app.agent to register itself, never the reverse.

[[tool.importlinter.contracts]]
name = "Eval subsystem is a leaf — core layers never import it"
type = "forbidden"
source_modules = ["app.models", "app.runtime", "app.services", "app.llm", "app.agent", "app.compiler"]
forbidden_modules = ["app.evals"]
# app.evals depends on core (models/runtime/services) and is used by app.web; the
# arrow points toward core. A lower layer importing app.evals would be a cycle-
# forming inversion — e.g. runtime.run_subset must stay eval-agnostic.

[[tool.importlinter.contracts]]
name = "Services never import the web layer"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.web"]
# app.services is web-independent domain logic: routes and templates depend on it,
# never the reverse. The storage root (EXAMPLES_DIR) and project-file readers
# (load_schemas, resolve_project_dir) live in app.services.workspace; app.web
# re-exports them so routers are unaffected.

[[tool.importlinter.contracts]]
name = "Status/review services stay below the routes layer"
type = "forbidden"
source_modules = ["app.services.project", "app.services.node_review", "app.services.versioning"]
forbidden_modules = ["app.main", "app.runtime", "app.compiler"]
# project (status snapshot), node_review (belief state) and versioning are pure
# helpers the routes and agent tools lean on — never the reverse — so they stay
# unit-testable without the runtime/compiler stack. The compile step a workflow
# regenerate needs lives in app.services.compilation (which wraps the compiler by
# design and is out of this contract's scope).
