# Dependencies + tool configuration. The app is still run from source (uvicorn
# app.main:app) and is NOT installed as a package — `[tool.uv] package = false`
# below is what keeps `uv sync` from trying to build it. The `[project]` table
# exists so uv can resolve and LOCK the dependency set into uv.lock; that lock is
# what CI and the container image install from.
#
# Lint/typecheck scope: ruff respects .gitignore, so examples/ and saydo/
# (generated + scratch content) are skipped via the ignore file, not here.

[project]
name = "carbon_paper"
version = "0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "openpyxl>=3.1",           # .xlsx reader behind input_data format=xlsx
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0",     # renders assistant chat text (app/web/markdown_render.py)
    "linkify-it-py>=2.0",      # markdown-it's linkify rule: a bare URL in a reply becomes a link
    "claude-agent-sdk>=0.2.10", # real LLM backend for llm_transform stages (needs the claude CLI installed)
    "mcp>=1.23",               # streamable-HTTP MCP server (app/mcp) — already a claude-agent-sdk dependency
    "alembic>=1.18",           # data migrations for the document store (alembic/versions)
    "pydantic>=2",             # stage/schema contract models (app/models)
    "starlark-pyo3==2026.1",   # sandboxed interpreter for starlark_row_function stages
    "pyjwt[crypto]>=2.10",     # verifies the Cloudflare Access JWT in app/web/access_gate.py
]

# Dev/test-only. `uv sync` installs these by default; the container image passes
# --no-dev so none of it ships. Lint + typecheck are pinned EXACTLY (stubs
# included) so a new rule or stub release cannot break CI on its own; bump
# deliberately.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8",        # `pytest -n auto`; the suite is parallel-safe
    "pytest-cov>=7.1",          # line coverage behind scripts/added_coverage.py
    "httpx>=0.27",              # fastapi.testclient (starlette TestClient) transport
    "ruff==0.15.20",
    "mypy==2.1.0",
    "import-linter==2.13",      # architecture-boundary contracts in [tool.importlinter]
    "radon==6.0.1",             # cyclomatic-complexity ratchet in tests/arch/test_complexity_ratchet.py
    "pandas-stubs==3.0.3.260530",
    "types-PyYAML==6.0.12.20250516",   # stubs for `import yaml` in app/services/eval_store.py
    "types-openpyxl==3.1.5.20260724",  # stubs for `import openpyxl` in tests/test_xlsx_input.py
]

[tool.uv]
# The repo is a dependency set, not a distribution: there is no package to build
# and app/ is imported from the working directory. Without this uv sync fails
# trying to build `carbon_paper` as a wheel.
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's default select (E4, E7, E9, F) plus BLE (flake8-blind-except): never
# catch bare `except Exception`/`except:` — catch specific exception types.
select = ["E4", "E7", "E9", "F", "BLE"]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts", "tests"]
# `tests` is checked directly (in `files`), which also puts its root on mypy's
# module search path: the colocated arch tests under app/ (in _arch_tests/
# folders) can `from arch import ...` because tests/arch/ is a package, and the
# tests/ tree's top-level modules (test_*.py) resolve by basename — mirroring
# pytest.ini's `pythonpath = . tests`. Listing `tests` in `mypy_path` as well
# would make mypy see each file under two names (test_x AND tests.test_x) and
# fail with "Source file found twice under different module names".
# No blanket ignore_missing_imports: pandas-stubs and types-PyYAML are installed
# via the `dev` dependency group, and the other deps ship their own types.

# pyarrow is the exception: its compiled `pyarrow.lib` extension ships no
# py.typed marker, so mypy can't analyze `import pyarrow` under CI (a locally
# installed marker masks this). Scope the exemption to pyarrow only.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# radon ships no py.typed marker and no types-radon stub package exists on
# PyPI, so mypy can't analyze `radon.complexity`/`radon.visitors` (used by
# tests/arch/test_complexity_ratchet.py). Scope the exemption to radon only.
[[tool.mypy.overrides]]
module = ["radon", "radon.*"]
ignore_missing_imports = true

# Architecture boundaries, enforced by import-linter (`PYTHONPATH=. lint-imports`).
# Expressed as a WHITELIST: each restricted module is `protected` and declares the
# only modules allowed to import it — a new cross-layer import is denied by default
# (caught), not allowed until someone remembers to forbid it. Core modules
# (app.models, app.core.errors, app.core.llm, app.core.agent) are left open: everything may depend on them.
# Content-level checks live in tests/arch/.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "app.web imported only by the entrypoint"
type = "protected"
protected_modules = ["app.web"]
allowed_importers = ["app.main"]
# The web layer is the top: app.main mounts it, nothing else imports it. app.services
# in particular stays web-independent — projects_dir / load_schemas live in
# app.services.workspace and app.web re-exports them so routers are unaffected.

[[tool.importlinter.contracts]]
name = "app.services imported only by cli, web, runtime, evals, compiler, agents, seeds, tools"
type = "protected"
protected_modules = ["app.services"]
allowed_importers = ["app.cli", "app.web", "app.runtime", "app.evals", "app.compiler", "app.agents", "app.seeds", "app.tools"]
# Domain logic the upper layers lean on. As a declared whitelist, a new importer is
# a deliberate edit, not an accident. (services → compiler is fine — compilation and
# generation wrap it — which is why app.compiler lists app.services below.) app.cli is
# an entrypoint, not a layer: `python -m app.cli <project>` runs one workflow and sits
# above everything here, beside app.main, which is why nothing imports it. app.agents
# is the hydrated editing agent, a top-level interface like app.web: it reads and edits
# projects through app.services.stage_edit / app.services.project. app.mcp is NOT here —
# it reaches everything through app.tools, held by its own contract below. app.seeds'
# capture scripts compose the project export/import seam the same way — never sqlite3,
# app.core.persistence, or app.core.frames directly.

[[tool.importlinter.contracts]]
name = "app.compiler imported only by services"
type = "protected"
protected_modules = ["app.compiler"]
allowed_importers = ["app.services"]
# app.services.generation wraps the data-model and stage-test generators by design.
# The reusable agent spine (app.core.agent) must not import it.

[[tool.importlinter.contracts]]
name = "app.runtime imported only by evals, web, and four named service seams"
type = "protected"
protected_modules = ["app.runtime"]
allowed_importers = ["app.evals", "app.web", "app.services.run", "app.services.workflow_test", "app.services.stage_tests", "app.services.scope"]
# The runner is driven by the top-level interfaces: web and evals. app.core.agent sits below
# the runtime (llm.py imports app.core.agent.agent.Agent as the reply backend) rather than the
# other way round, so it is not an importer here. app.services stays out of the runtime EXCEPT
# three named seams: app.services.run (the production run seam — the sole importer of
# app.runtime.runner, see the contract below), app.services.workflow_test (the workflow-test
# seam, which reaches only app.runtime.executor), and app.services.stage_tests (running a
# stage's authored tests outside a run, which both authoring surfaces and the compile page
# reach through app.tools) and app.services.scope (reading a finished run's branches back,
# which is not the runner's job — the module belongs in a package that may read the runtime,
# see https://github.com/surveit/carbonpaper/issues/834). Every other service module stays
# runtime-free — status/review helpers must not reach in.

[[tool.importlinter.contracts]]
name = "app.runtime.preview imported only by web"
type = "protected"
protected_modules = ["app.runtime.preview"]
allowed_importers = ["app.web"]
# The scratch re-run runs a stage in memory and persists nothing. It hands back a frame of
# real values and renders none of it — turning cells into display text is app.web's job, and
# `render_frame_as_text` lives there so no runtime module can reach it (app.web is protected
# above, importable only by app.main). Frames of text must never flow back toward the runner.

[[tool.importlinter.contracts]]
name = "app.evals is a leaf — imported only by web and tools"
type = "protected"
protected_modules = ["app.evals"]
allowed_importers = ["app.web", "app.tools"]
# evals depends on core (models/runtime/services) and is surfaced by app.web; the
# arrow points toward core. A lower layer importing evals would be a cycle-forming
# inversion — e.g. runtime.run_subset must stay eval-agnostic. app.tools is not a lower
# layer: it sits beside app.evals, above app.services and below the surfaces that expose
# a tool, so the run_eval tool reaches the runner the same way the Run button does.

[[tool.importlinter.contracts]]
name = "app.core.sqlite_store imported only by the store wiring"
type = "protected"
protected_modules = ["app.core.sqlite_store"]
allowed_importers = ["app.core.store_config"]
# Which database backs the app is chosen in ONE place: store_config hands the engine to
# configure_store and every other module reaches storage through the DocumentStore
# protocol. Whitelisted, like every other boundary here, so a second module reaching for
# sqlite is denied by default rather than allowed until someone remembers to forbid it —
# which is also what keeps app.models off the engine, without naming app.models.
# app.core.persistence is NOT protected: it is the record base and the store handle,
# pydantic and an indirection with no engine behind it, so a record may sit beside the
# contract it embeds without dragging sqlite into the type layer. Splitting the old fused
# module is what makes that distinction expressible.

[[tool.importlinter.contracts]]
name = "app.core sits below the domain contracts"
type = "layers"
layers = ["app.models", "app.core"]
# Position, not a list of things not to import: a module added to app.core inherits the
# ordering instead of needing an entry somewhere. app.core is generic infrastructure
# (llm, agent, persistence, errors, frames, utils); the contracts sit above it.

[[tool.importlinter.contracts]]
name = "the store handle is reached only by the record base and the store wiring"
type = "protected"
protected_modules = ["app.core.persistence"]
allowed_importers = ["app.core.record", "app.core.store_config", "app.core.sqlite_store"]
# `get_store()` was callable from anywhere, and a caller holding the handle can write
# any collection under any id with no record class in the way — which is how `eval` and
# `eval_run` came to exist as stored collections nothing modelled, and how `run_note`
# and `archived_run` were left behind by a rename with no class to notice. Reaching
# storage now means going through a record. app.core.sqlite_store is the implementation
# of the protocol declared here, not a caller of the handle; app.core.store_config is the
# composition root that hands the engine in. The JSON aliases moved to
# app.core.json_types, which anyone may import: naming the shape of a payload is not
# reaching for storage.

[[tool.importlinter.contracts]]
name = "app.core.record imported only by core and the record modules"
type = "protected"
protected_modules = ["app.core.record"]
allowed_importers = ["app.core", "app.models.records"]
# Declaring a record IS importing this module, so a whitelist here is a whitelist of the
# places a stored row's shape may be written down — sweeping in a way an AST scan of one
# directory is not. A service, the web layer, the tools and the compiler are all denied by
# default: they operate on records through the functions that own a record's lifecycle.
# app.models.records is where every project record lives, one module each — the runtime's
# four included. Their writers stay in app/runtime and are named in that package's
# test_stages_no_cross_run_disk.py allowlist, which keys on the writing module, not on
# where the record is declared. app.core covers the four records below app.models.
# The store seam (get_store, now_iso, JsonDict) stayed in app.core.persistence, which is
# unprotected: reaching storage is not the same act as declaring a row.

[[tool.importlinter.contracts]]
name = "inside app.core, the store sits below the rest"
type = "layers"
containers = ["app.core"]
layers = ["agent | llm", "sqlite_store", "record", "persistence"]
# The engine sits below the rest of core and above the record base whose protocol it
# satisfies, which is what makes "records depend on the store, never the reverse" true by
# construction rather than by a list someone has to keep current.

[[tool.importlinter.contracts]]
name = "app.mcp imported only by the entrypoint"
type = "protected"
protected_modules = ["app.mcp"]
allowed_importers = ["app.main"]
# The MCP surface is a top-level interface like app.web: app.main mounts it, nothing else
# imports it. The other direction is held by ABSENCE: app.mcp is on no whitelist in this
# file but app.tools', so every protected layer denies it and the server is left as a
# transport — it decodes a call, hands it to a tool, encodes the reply. That is what stops
# a tool existing here and not on the editing agent, which is how run_workflow ended up on
# one surface. app.models and app.core stay open to it, as they are to every package.

[[tool.importlinter.contracts]]
name = "app.agents imported only by the entrypoint"
type = "protected"
protected_modules = ["app.agents"]
allowed_importers = ["app.main"]
# The hydrated editing agent is a top-level interface like app.web / app.mcp:
# app.main registers it on the shared engine, nothing else imports it. It leans
# on app.core.agent (the engine) + app.tools (what its tools are).

[[tool.importlinter.contracts]]
name = "app.tools imported only by the surfaces that expose a tool"
type = "protected"
protected_modules = ["app.tools"]
allowed_importers = ["app.agents", "app.mcp"]
# What a tool IS — its implementation, input schema and the prose the model reads —
# sits above app.services and below the runtimes that expose one. Both surfaces read
# it and neither reads the other, which is the whole reason it is its own layer.

[[tool.importlinter.contracts]]
name = "production run entry points reached only by the run service"
type = "protected"
protected_modules = ["app.runtime.runner"]
allowed_importers = ["app.services.run"]
# app.runtime.runner holds the production run-lifecycle entry points (prepare_run,
# execute_run, run_prepared, resume_run) — the only functions that create a production
# run record under runs/. A non-production run (an eval, or a test
# run) reaches the shared execution engine through app.runtime.executor (run_subset /
# _execute_stages), never these entry points, so it can never mint a production run.
# app.services.run is the SOLE importer: the web run UI (app.web.routers.runs), its
# version resolver (app.web.loading) and the CLI (app.cli) drive runs
# through that service seam rather than importing the runner directly, so this stays a
# single named door into production runs.

[[tool.importlinter.contracts]]
name = "the runner reads no services module — a caller hands it a version's stages"
type = "forbidden"
source_modules = ["app.runtime.runner"]
forbidden_modules = ["app.services"]
# The other half of the door above. The runner executes the stages it is given;
# resolving WHICH version to pin and loading that snapshot are version lifecycle and
# live in app.services.versioning (resolve_version_id / load_version_stages), which
# app.services.run composes before calling in. Without this the arrow runs both ways —
# app.services.run -> app.runtime.runner -> app.services.versioning — and "services sits
# below the runtime" stops being true of the one module that most needs it to be.

# NB: "app.seeds reaches the store through services" is enforced as an AST allowlist
# in app/seeds/_arch_tests/test_seed_reaches_store_via_services.py (check_no_import),
# not a forbidden contract here — same as the cancellation stdlib-leaf rule.
