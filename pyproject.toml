# Tool configuration only — the app is run from source (uvicorn app.main:app),
# not installed as a package.
#
# Lint/typecheck scope: ruff respects .gitignore, so examples/ and saydo/
# (generated + scratch content) are skipped via the ignore file, not here.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's default select (E4, E7, E9, F) plus BLE (flake8-blind-except): never
# catch bare `except Exception`/`except:` — catch specific exception types.
select = ["E4", "E7", "E9", "F", "BLE"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
mypy_path = "tests"
# Colocated arch tests live under app/ (in _arch_tests/ folders) but import the
# `arch` toolkit from tests/arch/. pytest.ini puts tests/ on sys.path via
# `pythonpath = . tests`; this is the mypy mirror, so `from arch import ...`
# resolves statically — and pulls the toolkit into the type-checked set.
# No blanket ignore_missing_imports: pandas-stubs and types-PyYAML are installed
# via requirements-dev.txt, and the other deps ship their own types.

# pyarrow is the exception: its compiled `pyarrow.lib` extension ships no
# py.typed marker, so mypy can't analyze `import pyarrow` under CI (a locally
# installed marker masks this). Scope the exemption to pyarrow only.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Architecture boundaries, enforced by import-linter (`PYTHONPATH=. lint-imports`).
# Expressed as a WHITELIST: each restricted module is `protected` and declares the
# only modules allowed to import it — a new cross-layer import is denied by default
# (caught), not allowed until someone remembers to forbid it. Core modules
# (app.core.models, app.core.errors, app.core.llm, app.core.agent) are left open: everything may depend on them.
# Content-level checks live in tests/arch/.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "app.web imported only by the entrypoint"
type = "protected"
protected_modules = ["app.web"]
allowed_importers = ["app.main"]
# The web layer is the top: app.main mounts it, nothing else imports it. app.services
# in particular stays web-independent — EXAMPLES_DIR / load_schemas live in
# app.services.workspace and app.web re-exports them so routers are unaffected.

[[tool.importlinter.contracts]]
name = "app.services imported only by web, runtime, evals, compiler, mcp, agents"
type = "protected"
protected_modules = ["app.services"]
allowed_importers = ["app.web", "app.runtime", "app.evals", "app.compiler", "app.mcp", "app.agents"]
# Domain logic the upper layers lean on. As a declared whitelist, a new importer is
# a deliberate edit, not an accident. (services → compiler is fine — compilation and
# generation wrap it — which is why app.compiler lists app.services below.) app.agents
# is the hydrated editing agent, a top-level interface like app.web / app.mcp: it reads
# and edits projects through app.services.compilation / app.services.project.

[[tool.importlinter.contracts]]
name = "app.compiler imported only by the entrypoint and services"
type = "protected"
protected_modules = ["app.compiler"]
allowed_importers = ["app.main", "app.services"]
# app.services.compilation / generation wrap the compile mechanism by design; app.main
# runs it from the CLI. The reusable agent spine (app.core.agent) must not import it.

[[tool.importlinter.contracts]]
name = "app.runtime imported only by evals, web, mcp"
type = "protected"
protected_modules = ["app.runtime"]
allowed_importers = ["app.evals", "app.web", "app.mcp"]
# The runner is driven by the top-level interfaces: web, evals, and mcp (the glassbox
# authoring surface, a top-level runtime driver like app.web — its run_tests tool runs a
# stage's authored tests against its current code). app.core.agent sits below the runtime
# (llm.py imports app.core.agent.agent.Agent as the reply backend) rather than the other
# way round, so it is not an importer here. app.services must not reach into it —
# status/review helpers stay runtime-free.

[[tool.importlinter.contracts]]
name = "app.evals is a leaf — imported only by web"
type = "protected"
protected_modules = ["app.evals"]
allowed_importers = ["app.web"]
# evals depends on core (models/runtime/services) and is surfaced by app.web; the
# arrow points toward core. A lower layer importing evals would be a cycle-forming
# inversion — e.g. runtime.run_subset must stay eval-agnostic.

[[tool.importlinter.contracts]]
name = "app.core.persistence sits at the bottom — imports no app layer but core.errors"
type = "forbidden"
source_modules = ["app.core.persistence"]
forbidden_modules = [
    "app.core.models", "app.core.llm",
    "app.services", "app.runtime", "app.web", "app.core.agent", "app.compiler", "app.evals",
]
# The document store is the lowest layer: it may lean on app.core.errors (where
# DocumentNotFound lives) and nothing else first-party. If it imported the contracts
# (app.core.models) or any upper layer, "records depend on the store, never the
# reverse" would be a lie and the backend would stop being swappable in isolation.

[[tool.importlinter.contracts]]
name = "app.core.models stays pure — never imports the store"
type = "forbidden"
source_modules = ["app.core.models"]
forbidden_modules = ["app.core.persistence"]
# The pure contracts (Stage, TableSchema, …) are validation-only and side-effect-free.
# Records embed contracts, so the arrow is records → contracts; a contract importing
# persistence would invert that and drag storage into the type layer.

[[tool.importlinter.contracts]]
name = "app.mcp imported only by the entrypoint"
type = "protected"
protected_modules = ["app.mcp"]
allowed_importers = ["app.main"]
# The MCP surface is a top-level interface like app.web: app.main mounts it,
# nothing else imports it. It depends only on app.services (+ app.core).

[[tool.importlinter.contracts]]
name = "app.agents imported only by the entrypoint"
type = "protected"
protected_modules = ["app.agents"]
allowed_importers = ["app.main"]
# The hydrated editing agent is a top-level interface like app.web / app.mcp:
# app.main registers it on the shared engine, nothing else imports it. It leans
# on app.core.agent (the engine) + app.services (to read/edit projects).

[[tool.importlinter.contracts]]
name = "app.runtime.cancellation is a stdlib-only leaf — imports no app module"
type = "forbidden"
source_modules = ["app.runtime.cancellation"]
forbidden_modules = [
    "app.core", "app.services", "app.web", "app.compiler", "app.evals", "app.mcp", "app.agents", "app.main",
    "app.runtime.runner", "app.runtime.stages", "app.runtime.llm", "app.runtime.options",
    "app.runtime.preview", "app.runtime.trace", "app.runtime.validation", "app.runtime.stage_tests",
]
# The cancel registry is keyed on a run's logical (project, run_id) identity,
# never its persistence layout (see cancellation.py's module docstring) — so it
# must import nothing from app, stdlib only. A "forbidden" contract (unlike an
# AST scan for `node.level == 0` imports) resolves relative imports on the real
# import graph, so a same-package `from .runner import x` is caught exactly
# like `from app.runtime.runner import x`. "app" and "app.runtime" themselves
# can't be listed here — import-linter skips a forbidden module that contains
# the source module as an "overlap" (the same reason the app.core.persistence
# contract above enumerates its siblings instead of bare "app") — so every
# other app module is enumerated individually instead.
