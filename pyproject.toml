# Tool configuration only — the app is run from source (uvicorn app.main:app),
# not installed as a package.
#
# Lint/typecheck scope: ruff respects .gitignore, so examples/ and saydo/
# (generated + scratch content) are skipped via the ignore file, not here.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's default select (E4, E7, E9, F) plus BLE (flake8-blind-except): never
# catch bare `except Exception`/`except:` — catch specific exception types.
select = ["E4", "E7", "E9", "F", "BLE"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tools", "tests"]
# `tests` is checked directly (in `files`), which also puts its root on mypy's
# module search path: the colocated arch tests under app/ (in _arch_tests/
# folders) can `from arch import ...` because tests/arch/ is a package, and the
# tests/ tree's top-level modules (test_*.py) resolve by basename — mirroring
# pytest.ini's `pythonpath = . tests`. Listing `tests` in `mypy_path` as well
# would make mypy see each file under two names (test_x AND tests.test_x) and
# fail with "Source file found twice under different module names".
# No blanket ignore_missing_imports: pandas-stubs and types-PyYAML are installed
# via requirements-dev.txt, and the other deps ship their own types.

# pyarrow is the exception: its compiled `pyarrow.lib` extension ships no
# py.typed marker, so mypy can't analyze `import pyarrow` under CI (a locally
# installed marker masks this). Scope the exemption to pyarrow only.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# radon ships no py.typed marker and no types-radon stub package exists on
# PyPI, so mypy can't analyze `radon.complexity`/`radon.visitors` (used by
# tests/arch/test_complexity_ratchet.py). Scope the exemption to radon only.
[[tool.mypy.overrides]]
module = ["radon", "radon.*"]
ignore_missing_imports = true

# Architecture boundaries, enforced by import-linter (`PYTHONPATH=. lint-imports`).
# Expressed as a WHITELIST: each restricted module is `protected` and declares the
# only modules allowed to import it — a new cross-layer import is denied by default
# (caught), not allowed until someone remembers to forbid it. Core modules
# (app.models, app.core.errors, app.core.llm, app.core.agent) are left open: everything may depend on them.
# Content-level checks live in tests/arch/.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "app.web imported only by the entrypoint"
type = "protected"
protected_modules = ["app.web"]
allowed_importers = ["app.main"]
# The web layer is the top: app.main mounts it, nothing else imports it. app.services
# in particular stays web-independent — projects_dir / load_schemas live in
# app.services.workspace and app.web re-exports them so routers are unaffected.

[[tool.importlinter.contracts]]
name = "app.services imported only by web, runtime, evals, compiler, mcp, agents, seeds"
type = "protected"
protected_modules = ["app.services"]
allowed_importers = ["app.web", "app.runtime", "app.evals", "app.compiler", "app.mcp", "app.agents", "app.seeds"]
# Domain logic the upper layers lean on. As a declared whitelist, a new importer is
# a deliberate edit, not an accident. (services → compiler is fine — compilation and
# generation wrap it — which is why app.compiler lists app.services below.) app.agents
# is the hydrated editing agent, a top-level interface like app.web / app.mcp: it reads
# and edits projects through app.services.stage_edit / app.services.project. app.seeds'
# capture scripts compose the project export/import seam the same way — never sqlite3,
# app.core.persistence, or app.core.frames directly.

[[tool.importlinter.contracts]]
name = "app.compiler imported only by services"
type = "protected"
protected_modules = ["app.compiler"]
allowed_importers = ["app.services"]
# app.services.generation wraps the data-model and stage-test generators by design.
# The reusable agent spine (app.core.agent) must not import it.

[[tool.importlinter.contracts]]
name = "app.runtime imported only by evals, web, mcp"
type = "protected"
protected_modules = ["app.runtime"]
allowed_importers = ["app.evals", "app.web", "app.mcp", "app.services.run", "app.services.workflow_test"]
# The runner is driven by the top-level interfaces: web, evals, and mcp (the glassbox
# authoring surface, a top-level runtime driver like app.web — its run_stage_tests tool runs a
# stage's authored tests against its current code). app.core.agent sits below the runtime
# (llm.py imports app.core.agent.agent.Agent as the reply backend) rather than the other
# way round, so it is not an importer here. app.services stays out of the runtime EXCEPT
# the two named run seams: app.services.run (the production run seam — the sole importer of
# app.runtime.runner, see the contract below) and app.services.workflow_test (the workflow-test
# seam, which reaches only app.runtime.executor). Every other service module stays runtime-free —
# status/review helpers must not reach in.

[[tool.importlinter.contracts]]
name = "app.evals is a leaf — imported only by web"
type = "protected"
protected_modules = ["app.evals"]
allowed_importers = ["app.web"]
# evals depends on core (models/runtime/services) and is surfaced by app.web; the
# arrow points toward core. A lower layer importing evals would be a cycle-forming
# inversion — e.g. runtime.run_subset must stay eval-agnostic.

[[tool.importlinter.contracts]]
name = "app.core.persistence sits at the bottom — imports no app layer but core.errors"
type = "forbidden"
source_modules = ["app.core.persistence"]
forbidden_modules = [
    "app.models", "app.core.llm",
    "app.services", "app.runtime", "app.web", "app.core.agent", "app.compiler", "app.evals",
]
# The document store is the lowest layer: it may lean on app.core.errors (where
# DocumentNotFound lives) and nothing else first-party. If it imported the contracts
# (app.models) or any upper layer, "records depend on the store, never the
# reverse" would be a lie and the backend would stop being swappable in isolation.

[[tool.importlinter.contracts]]
name = "app.models stays pure — never imports the store"
type = "forbidden"
source_modules = ["app.models"]
forbidden_modules = ["app.core.persistence"]
# The pure contracts (Stage, TableSchema, …) are validation-only and side-effect-free.
# Records embed contracts, so the arrow is records → contracts; a contract importing
# persistence would invert that and drag storage into the type layer.

[[tool.importlinter.contracts]]
name = "app.core does not import the domain models"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.models"]
# app.core (llm, agent, persistence, errors, frames, utils) is generic infrastructure
# and must sit below the domain layer. app.models (Stage, TableSchema, Workflow, …)
# sits above it, so a dependency from app.core back onto app.models would be a cycle.

[[tool.importlinter.contracts]]
name = "app.mcp imported only by the entrypoint"
type = "protected"
protected_modules = ["app.mcp"]
allowed_importers = ["app.main"]
# The MCP surface is a top-level interface like app.web: app.main mounts it,
# nothing else imports it. It depends only on app.services (+ app.core).

[[tool.importlinter.contracts]]
name = "app.agents imported only by the entrypoint"
type = "protected"
protected_modules = ["app.agents"]
allowed_importers = ["app.main"]
# The hydrated editing agent is a top-level interface like app.web / app.mcp:
# app.main registers it on the shared engine, nothing else imports it. It leans
# on app.core.agent (the engine) + app.services (to read/edit projects).

[[tool.importlinter.contracts]]
name = "production run entry points reached only by the run service"
type = "protected"
protected_modules = ["app.runtime.runner"]
allowed_importers = ["app.services.run"]
# app.runtime.runner holds the production run-lifecycle entry points (prepare_run,
# execute_run, run_prepared, resume_run, resolve_version_id) — the only functions that
# create a production run record under runs/. A non-production run (an eval, or a test
# run) reaches the shared execution engine through app.runtime.executor (run_subset /
# _execute_stages), never these entry points, so it can never mint a production run.
# app.services.run is the SOLE importer: the web run UI (app.web.routers.runs) and its
# version resolver (app.web.loading) drive runs through that service seam rather than
# importing the runner directly, so this stays a single named door into production runs.

# NB: "app.seeds reaches the store through services" is enforced as an AST allowlist
# in app/seeds/_arch_tests/test_seed_reaches_store_via_services.py (check_no_import),
# not a forbidden contract here — same as the cancellation stdlib-leaf rule.
